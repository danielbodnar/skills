# Dependabot version updates. Ecosystems map to manifests actually present in
# this repo: bun (package.json + bun.lock) and GitHub Actions workflows.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # CLI dependencies (package.json + bun.lock at the repo root)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"

  # Pinned action versions in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
