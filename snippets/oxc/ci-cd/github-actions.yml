name: Quality Checks with Oxc

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Run oxlint
        run: bun run oxlint
        
      - name: Check formatting with Prettier
        run: bun run prettier --check .
        
      - name: Type check with oxc-transform
        run: bun run oxc-transform --check src/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Run tests
        run: bun test
        
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: success()

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: [quality, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Build with oxc-transform
        run: bun run build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

---
# Advanced workflow with caching and matrix strategy

name: Advanced Oxc Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  BUN_VERSION: 'latest'

jobs:
  cache-dependencies:
    name: Cache Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate cache key
        id: cache-key
        run: echo "key=deps-${{ hashFiles('**/bun.lockb') }}" >> $GITHUB_OUTPUT
        
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.cache-key.outputs.key }}

  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: cache-dependencies
    
    strategy:
      matrix:
        check: [lint, format, types]
        
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.cache-dependencies.outputs.cache-key }}
          
      - name: Install dependencies
        run: bun install
        
      - name: Run lint check
        if: matrix.check == 'lint'
        run: |
          echo "Running oxlint..."
          bun run oxlint --quiet
          
      - name: Run format check
        if: matrix.check == 'format'
        run: |
          echo "Checking formatting..."
          bun run prettier --check . --log-level warn
          
      - name: Run type check
        if: matrix.check == 'types'
        run: |
          echo "Running type check..."
          bun run oxc-transform --check src/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: cache-dependencies
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  performance-test:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: [cache-dependencies, lint-and-format]
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.cache-dependencies.outputs.cache-key }}
          
      - name: Install dependencies
        run: bun install
        
      - name: Benchmark oxlint performance
        run: |
          echo "Benchmarking oxlint..."
          time bun run oxlint > /tmp/oxlint-time.txt 2>&1
          cat /tmp/oxlint-time.txt
          
      - name: Benchmark prettier performance
        run: |
          echo "Benchmarking prettier..."
          time bun run prettier --check . > /tmp/prettier-time.txt 2>&1
          cat /tmp/prettier-time.txt

  multi-platform:
    name: Cross-Platform Test
    runs-on: ${{ matrix.os }}
    needs: cache-dependencies
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          
      - name: Install dependencies
        run: bun install
        
      - name: Run quality checks
        run: |
          bun run oxlint
          bun run prettier --check .

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [lint-and-format, security-scan, performance-test]
    if: github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          
      - name: Install dependencies
        run: bun install
        
      - name: Build project
        run: |
          echo "Building with oxc-transform..."
          bun run build
          
      - name: Deploy to preview environment
        run: |
          echo "Deploying preview..."
          # Your deployment commands here
          
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview deployed successfully with Oxc toolchain!'
            });

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint-and-format, security-scan, performance-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          
      - name: Install dependencies
        run: bun install
        
      - name: Build project
        run: bun run build
        
      - name: Generate declarations
        run: bun run oxc-transform --declaration src/ --out-dir dist/types/
        
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}