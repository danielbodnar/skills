# Prettier configuration with oxc plugin

plugins:
  - "@prettier/plugin-oxc"

# Basic formatting options
semi: true
singleQuote: true
trailingComma: "es5"
tabWidth: 2
printWidth: 80
useTabs: false

# File-specific overrides
overrides:
  # JavaScript files using oxc parser
  - files: "**/*.{js,mjs,cjs,jsx}"
    options:
      plugins: ["@prettier/plugin-oxc"]
      parser: "oxc"
      
  # TypeScript files using oxc-ts parser  
  - files: "**/*.{ts,mts,cts,tsx}"
    options:
      plugins: ["@prettier/plugin-oxc"]
      parser: "oxc-ts"
      
  # Vue single-file components
  - files: "**/*.vue"
    options:
      parser: "vue"
      
  # Markdown files
  - files: "**/*.md"
    options:
      parser: "markdown"
      proseWrap: "preserve"
      
  # JSON files
  - files: "**/*.json"
    options:
      parser: "json"
      trailingComma: "none"
      
  # YAML files
  - files: "**/*.{yml,yaml}"
    options:
      parser: "yaml"
      tabWidth: 2