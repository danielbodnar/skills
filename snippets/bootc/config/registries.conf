# Container Registry Configuration
# Place this file at /etc/containers/registries.conf.d/bootc.conf

# Insecure registries (for development/internal use)
[[registry]]
location="localhost:5000"
insecure=true

[[registry]]
location="registry.internal.company.com"
insecure=false
blocked=false

# Registry mirrors for performance
[[registry]]
prefix="docker.io"
location="mirror.gcr.io"

[[registry]]
prefix="quay.io"
location="quay-mirror.internal.company.com"

# Blocked registries for security
[[registry]]
location="untrusted-registry.example.com"
blocked=true

# Short name aliases
[aliases]
"fedora-bootc" = "quay.io/fedora/fedora-bootc"
"centos-bootc" = "quay.io/centos-bootc/centos-bootc"
"rhel-bootc" = "registry.redhat.io/rhel9/rhel-bootc"