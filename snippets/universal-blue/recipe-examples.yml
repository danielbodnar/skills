# BlueBuild Recipe Examples
# Collection of recipe configurations for different use cases

---
# Basic Development Environment
name: dev-desktop
description: Development-focused Universal Blue image
base-image: ghcr.io/ublue-os/silverblue-main:latest
image-version: latest

stages:
  - type: rpm-ostree
    repos:
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
    install:
      - code
      - git
      - nodejs
      - npm
      - python3-pip
      - golang
      - rust
      - cargo
      - distrobox
      - toolbox
      - flatpak-builder

  - type: script
    scripts:
      - scripts/setup-development.sh

  - type: files
    files:
      - src: files/etc/profile.d/development.sh
        dst: /etc/profile.d/development.sh

---
# Gaming-Focused Configuration
name: gaming-desktop
description: Gaming-optimized Universal Blue image
base-image: ghcr.io/ublue-os/bazzite:latest
image-version: latest

stages:
  - type: rpm-ostree
    repos:
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
    install:
      - steam
      - lutris
      - heroic-games-launcher
      - wine
      - winetricks
      - gamemode
      - mangohud
      - discord

  - type: script
    scripts:
      - scripts/setup-gaming.sh
      - scripts/configure-nvidia.sh

  - type: files
    files:
      - src: files/etc/sysctl.d/99-gaming.conf
        dst: /etc/sysctl.d/99-gaming.conf

---
# Minimal Server Configuration
name: server-base
description: Minimal server image based on Universal Blue
base-image: ghcr.io/ublue-os/base:latest
image-version: latest

stages:
  - type: rpm-ostree
    install:
      - podman
      - buildah
      - skopeo
      - htop
      - tmux
      - vim
      - git
      - curl
      - wget

  - type: script
    scripts:
      - scripts/setup-server.sh
      - scripts/hardening.sh

  - type: files
    files:
      - src: files/etc/ssh/sshd_config.d/99-custom.conf
        dst: /etc/ssh/sshd_config.d/99-custom.conf

