---
# Security-Focused Configuration
name: security-desktop
description: Security-hardened Universal Blue image
base-image: ghcr.io/ublue-os/silverblue-main:latest
image-version: latest

stages:
  - type: rpm-ostree
    install:
      - firejail
      - apparmor-utils
      - clamav
      - clamav-update
      - rkhunter
      - chkrootkit
      - aide
      - fail2ban

  - type: script
    scripts:
      - scripts/security-hardening.sh
      - scripts/setup-apparmor.sh

  - type: files
    files:
      - src: files/etc/apparmor.d/custom-profiles/
        dst: /etc/apparmor.d/
      - src: files/etc/sysctl.d/99-security.conf
        dst: /etc/sysctl.d/99-security.conf

---
# Custom Kernel Configuration
name: custom-kernel
description: Universal Blue with custom kernel configuration
base-image: ghcr.io/ublue-os/silverblue-main:latest
image-version: latest

stages:
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/dwalluck/kernel-fsync/repo/fedora-$(rpm -E %fedora)/dwalluck-kernel-fsync-fedora-$(rpm -E %fedora).repo
    install:
      - kernel-fsync
      - kernel-fsync-devel

  - type: script
    scripts:
      - scripts/configure-kernel.sh

  - type: files
    files:
      - src: files/etc/dracut.conf.d/99-custom.conf
        dst: /etc/dracut.conf.d/99-custom.conf