# Talos Linux Machine Configuration Example
version: v1alpha1
debug: false
persist: true

machine:
  type: controlplane
  token: ""
  ca:
    crt: ""
    key: ""
  certSANs:
    - 192.168.1.100
    - cluster.local
  
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.29.0
    defaultRuntimeSeccompProfileEnabled: true
    disableManifestsDirectory: true
    extraArgs:
      max-pods: "500"
      cluster-dns: "10.96.0.10"
      rotate-server-certificates: true
    
  network:
    hostname: talos-cp-1
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
    interfaces:
      - interface: eth0
        dhcp: true
        mtu: 1500
  
  install:
    disk: /dev/sda
    image: ghcr.io/siderolabs/installer:v1.6.0
    bootloader: true
    wipe: false
    extraKernelArgs:
      - console=ttyS0
      - console=tty0
      - panic=10
  
  sysctls:
    net.core.somaxconn: "65535"
    net.core.netdev_max_backlog: "4096"
    
  time:
    disabled: false
    servers:
      - time.cloudflare.com
      - time.google.com
      
  features:
    rbac: true
    stableHostname: true
    apidCheckExtKeyUsage: true
    diskQuotaSupport: true
    kubePrism:
      enabled: true
      port: 7445

cluster:
  id: ""
  secret: ""
  controlPlane:
    endpoint: https://192.168.1.100:6443
  clusterName: talos-cluster
  
  network:
    dnsDomain: cluster.local
    podSubnets:
      - 10.244.0.0/16
    serviceSubnets:
      - 10.96.0.0/12
    cni:
      name: flannel
  
  token: ""
  secretboxEncryptionSecret: ""
  
  ca:
    crt: ""
    key: ""
    
  allowSchedulingOnControlPlanes: false
  
  apiServer:
    image: registry.k8s.io/kube-apiserver:v1.29.0
    certSANs:
      - 192.168.1.100
      - cluster.local
    disablePodSecurityPolicy: true
    admissionControl:
      - name: PodSecurity
        configuration:
          apiVersion: pod-security.admission.config.k8s.io/v1alpha1
          kind: PodSecurityConfiguration
          defaults:
            enforce: "baseline"
            enforce-version: "latest"
            audit: "restricted"
            audit-version: "latest"
            warn: "restricted"
            warn-version: "latest"
          exemptions:
            usernames: []
            runtimeClasses: []
            namespaces: [kube-system]
    auditPolicy:
      apiVersion: audit.k8s.io/v1
      kind: Policy
      rules:
        - level: Metadata
  
  controllerManager:
    image: registry.k8s.io/kube-controller-manager:v1.29.0
    
  proxy:
    disabled: false
    image: registry.k8s.io/kube-proxy:v1.29.0
    
  scheduler:
    image: registry.k8s.io/kube-scheduler:v1.29.0
    
  discovery:
    enabled: true
    registries:
      kubernetes:
        disabled: false
      service:
        disabled: false
        
  etcd:
    ca:
      crt: ""
      key: ""
    subnet: 10.96.0.0/12
    
  coreDNS:
    disabled: false
    
  # Deploy additional manifests during bootstrap
  extraManifests:
    - https://raw.githubusercontent.com/kubernetes-sigs/metrics-server/v0.6.4/deploy/kubernetes/1.21+/metrics-server-deployment.yaml
    
  inlineManifests:
    - name: namespace-monitoring
      contents: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: monitoring
        ---
        apiVersion: v1
        kind: Namespace
        metadata:
          name: kube-public