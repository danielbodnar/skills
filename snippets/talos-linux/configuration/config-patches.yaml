# Talos Configuration Patches Examples

# Control Plane Patch - Enhanced API Server Configuration
# File: control-plane.patch.yaml
---
cluster:
  apiServer:
    extraArgs:
      enable-admission-plugins: "NodeRestriction,PodSecurity,ResourceQuota,LimitRanger"
      audit-log-maxage: "30"
      audit-log-maxbackup: "3" 
      audit-log-maxsize: "100"
      audit-log-path: "/var/log/audit.log"
      feature-gates: "RemoveSelfLink=false"
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
  controllerManager:
    extraArgs:
      bind-address: "0.0.0.0"
      feature-gates: "RotateKubeletServerCertificate=true"
  scheduler:
    extraArgs:
      bind-address: "0.0.0.0"

---
# Worker Node Patch - Enhanced Kubelet Configuration  
# File: worker.patch.yaml
machine:
  kubelet:
    extraArgs:
      max-pods: "250"
      cluster-dns: "10.96.0.10"
      cluster-domain: "cluster.local"
      feature-gates: "GracefulNodeShutdown=true"
      shutdown-grace-period: "30s"
      shutdown-grace-period-critical-pods: "10s"
      serialize-image-pulls: "false"
      registry-qps: "10"
      registry-burst: "20"
      event-qps: "10"
      event-burst: "20"
      kube-api-qps: "10"
      kube-api-burst: "20"
      rotate-server-certificates: "true"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "4000m"
        memory: "8Gi"

---
# Network Configuration Patch
# File: network.patch.yaml  
machine:
  network:
    interfaces:
      - interface: eth0
        dhcp: true
        mtu: 9000  # Jumbo frames
        vlans:
          - vlanId: 100
            dhcp: true
            mtu: 1500
      - interface: eth1
        addresses:
          - 192.168.100.10/24
        routes:
          - network: 10.0.0.0/8
            gateway: 192.168.100.1
            metric: 100
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
      - 192.168.1.1
    extraHostEntries:
      - ip: 192.168.1.100
        aliases:
          - cluster.local
          - api.cluster.local

---
# Disk and Installation Patch
# File: install.patch.yaml
machine:
  install:
    disk: /dev/nvme0n1
    image: ghcr.io/siderolabs/installer:v1.6.0
    bootloader: true
    wipe: false
    extraKernelArgs:
      - console=ttyS0,115200n8
      - console=tty0
      - net.ifnames=0
      - biosdevname=0
      - systemd.unified_cgroup_hierarchy=0
      - talos.platform=metal
    extensions:
      - image: ghcr.io/siderolabs/gvisor:20230629.0-v1.6.0
      - image: ghcr.io/siderolabs/intel-ucode:20230613-v1.6.0
  disks:
    - device: /dev/sdb
      partitions:
        - mountpoint: /var/lib/etcd
          size: 10GB
          options:
            - noatime
        - mountpoint: /var/lib/containerd  
          size: 100GB
          options:
            - noatime

---
# Security and Hardening Patch
# File: security.patch.yaml
machine:
  features:
    rbac: true
    stableHostname: true
    apidCheckExtKeyUsage: true
    diskQuotaSupport: true
    kubePrism:
      enabled: true
      port: 7445
  sysctls:
    # Network security
    net.ipv4.ip_forward: "1"
    net.ipv4.conf.all.rp_filter: "1"
    net.ipv4.conf.default.rp_filter: "1"
    net.ipv4.conf.all.accept_source_route: "0"
    net.ipv4.conf.default.accept_source_route: "0"
    net.ipv4.conf.all.secure_redirects: "1"
    net.ipv4.conf.default.secure_redirects: "1"
    net.ipv4.icmp_echo_ignore_broadcasts: "1"
    net.ipv4.icmp_ignore_bogus_error_responses: "1"
    net.ipv4.tcp_syncookies: "1"
    # Performance tuning
    net.core.netdev_max_backlog: "5000"
    net.core.rmem_max: "134217728"
    net.core.wmem_max: "134217728"
    net.ipv4.tcp_rmem: "4096 65536 134217728"
    net.ipv4.tcp_wmem: "4096 65536 134217728"
    fs.inotify.max_user_watches: "1048576"
    fs.inotify.max_user_instances: "8192"

cluster:
  allowSchedulingOnControlPlanes: false
  
---
# CNI Configuration Patch - Cilium
# File: cilium.patch.yaml
cluster:
  network:
    cni:
      name: none  # Disable default CNI
  inlineManifests:
    - name: cilium-install
      contents: |
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: cilium-install
          namespace: kube-system
        spec:
          template:
            spec:
              restartPolicy: OnFailure
              hostNetwork: true
              tolerations:
                - operator: Exists
              containers:
              - name: cilium-install
                image: quay.io/cilium/cilium-cli:latest
                command:
                  - cilium
                  - install
                  - --set
                  - ipam.mode=kubernetes
                  - --set  
                  - kubeProxyReplacement=strict

---
# Monitoring and Observability Patch
# File: monitoring.patch.yaml
cluster:
  extraManifests:
    - https://raw.githubusercontent.com/kubernetes-sigs/metrics-server/v0.6.4/deploy/kubernetes/1.21+/metrics-server-deployment.yaml
    - https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/main/manifests/setup/0namespace-namespace.yaml
  inlineManifests:
    - name: node-exporter
      contents: |
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: node-exporter
          namespace: monitoring
        spec:
          selector:
            matchLabels:
              app: node-exporter
          template:
            metadata:
              labels:
                app: node-exporter
            spec:
              hostNetwork: true
              hostPID: true
              containers:
              - name: node-exporter
                image: prom/node-exporter:latest
                ports:
                - containerPort: 9100
                args:
                  - --path.procfs=/host/proc
                  - --path.sysfs=/host/sys
                  - --collector.filesystem.ignored-mount-points
                  - "^/(sys|proc|dev|host|etc)($|/)"
                volumeMounts:
                - name: proc
                  mountPath: /host/proc
                  readOnly: true
                - name: sys
                  mountPath: /host/sys
                  readOnly: true
              volumes:
              - name: proc
                hostPath:
                  path: /proc
              - name: sys
                hostPath:
                  path: /sys