# Talos Linux RBAC Security Policies

# Talos API RBAC Configuration
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-admin
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: talos-admin
rules:
- apiGroups: [""]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["apps"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["extensions"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["networking.k8s.io"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: talos-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talos-admin
subjects:
- kind: ServiceAccount
  name: talos-admin
  namespace: kube-system

---
# Talos Operator Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-operator
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: talos-operator
rules:
- apiGroups: [""]
  resources:
  - nodes
  - pods
  - services
  - configmaps
  - secrets
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources:
  - deployments
  - daemonsets
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["extensions"]
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: talos-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talos-operator
subjects:
- kind: ServiceAccount
  name: talos-operator
  namespace: kube-system

---
# Monitoring Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-monitoring
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: talos-monitoring
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/metrics
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: talos-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talos-monitoring
subjects:
- kind: ServiceAccount
  name: talos-monitoring
  namespace: monitoring

---
# Developer Role (Limited Access)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: talos-developer
rules:
- apiGroups: [""]
  resources:
  - pods
  - pods/log
  - pods/status
  - services
  - configmaps
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources:
  - deployments
  - replicasets
  - daemonsets
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources:
  - pods/exec
  - pods/portforward
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-developers
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talos-developer
subjects:
- kind: User
  name: developer1
  apiGroup: rbac.authorization.k8s.io
- kind: User
  name: developer2
  apiGroup: rbac.authorization.k8s.io

---
# Pod Security Policy (for older Kubernetes versions)
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: talos-restricted
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: talos-psp-restricted
rules:
- apiGroups: ['policy']
  resources: ['podsecuritypolicies']
  verbs: ['use']
  resourceNames:
  - talos-restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: talos-psp-restricted
roleRef:
  kind: ClusterRole
  name: talos-psp-restricted
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: default
  namespace: default
- kind: ServiceAccount
  name: default
  namespace: kube-system

---
# Network Policy for Talos API Access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: talos-api-access
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app: talos-operator
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 50000  # Talos API port
    - protocol: TCP
      port: 6443   # Kubernetes API
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
# Talos ServiceAccount Injection Example
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-api-client
  namespace: default
  annotations:
    talos.dev/roles: "os:admin"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: talos-client
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: talos-client
  template:
    metadata:
      labels:
        app: talos-client
    spec:
      serviceAccountName: talos-api-client
      containers:
      - name: talos-client
        image: ghcr.io/siderolabs/talosctl:latest
        command: ["sleep", "infinity"]
        env:
        - name: TALOSCONFIG
          value: "/var/run/secrets/talos.dev/config"
        volumeMounts:
        - name: talos-config
          mountPath: /var/run/secrets/talos.dev
          readOnly: true
      volumes:
      - name: talos-config
        secret:
          secretName: talos-api-client-talos-config