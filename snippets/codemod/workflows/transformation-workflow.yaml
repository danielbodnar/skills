# Codemod Transformation Workflow Examples

# ==============================================
# Basic JavaScript/TypeScript Transformation
# ==============================================

version: 1

state:
  project_path: !string
  patterns: !array
    items: !object
      properties:
        name: !string
        pattern: !string
        rewrite: !string
        description: !string

nodes:
  - id: setup
    name: "Setup transformation environment"
    type: automatic
    steps:
      - run: |
          echo "Setting up transformation for ${project_path}"
          cd "${project_path}"
          npm install
          npm run lint -- --fix || true

  - id: backup
    name: "Create backup branch"
    type: automatic
    depends_on: [setup]
    steps:
      - run: |
          cd "${project_path}"
          git checkout -b "codemod-backup-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "codemod-transformation"

  - id: apply-transformations
    name: "Apply AST transformations"
    type: automatic
    depends_on: [backup]
    matrix:
      pattern: !state patterns
    steps:
      - run: |
          cd "${project_path}"
          echo "Applying transformation: ${pattern.name}"
          echo "Description: ${pattern.description}"
          
          npx codemod@next jssg \
            --pattern "${pattern.pattern}" \
            --rewrite "${pattern.rewrite}" \
            src/ \
            --dry-run
          
          echo "Preview complete. Applying transformation..."
          
          npx codemod@next jssg \
            --pattern "${pattern.pattern}" \
            --rewrite "${pattern.rewrite}" \
            src/

  - id: validate
    name: "Validate transformations"
    type: automatic
    depends_on: [apply-transformations]
    steps:
      - run: |
          cd "${project_path}"
          
          echo "Running linter..."
          npm run lint || {
            echo "Lint errors found, attempting auto-fix..."
            npm run lint -- --fix
          }
          
          echo "Running tests..."
          npm test || {
            echo "Tests failed after transformation"
            exit 1
          }
          
          echo "Running type checking..."
          npx tsc --noEmit || {
            echo "Type errors found after transformation"
            exit 1
          }

  - id: commit
    name: "Commit successful transformations"
    type: automatic
    depends_on: [validate]
    steps:
      - run: |
          cd "${project_path}"
          
          git add .
          git commit -m "refactor: apply codemod transformations
          
          Applied the following transformations:
          $(for pattern in ${patterns[@]}; do
            echo "- ${pattern.name}: ${pattern.description}"
          done)
          
          All tests pass and linting is clean."
          
          git push origin codemod-transformation

---

# ==============================================
# Multi-Repository Migration Workflow
# ==============================================

version: 1

state:
  repositories: !array
    items: !object
      properties:
        url: !string
        name: !string
        branch: !string
  migration_config: !object
    properties:
      from_version: !string
      to_version: !string
      transformations: !array
        items: !object
          properties:
            pattern: !string
            rewrite: !string

nodes:
  - id: clone-repositories
    name: "Clone repository"
    type: automatic
    matrix:
      repo: !state repositories
    steps:
      - run: |
          echo "Cloning ${repo.name} from ${repo.url}"
          git clone "${repo.url}" "repos/${repo.name}"
          cd "repos/${repo.name}"
          git checkout "${repo.branch}"

  - id: analyze-repositories
    name: "Analyze repository for migration needs"
    type: automatic
    depends_on: [clone-repositories]
    matrix:
      repo: !state repositories
    steps:
      - run: |
          cd "repos/${repo.name}"
          
          echo "Analyzing ${repo.name} for migration opportunities..."
          
          # Check if migration is needed
          if grep -r "${migration_config.from_version}" package.json; then
            echo "Repository needs migration from ${migration_config.from_version}"
            echo "true" > needs_migration.txt
          else
            echo "Repository already up to date"
            echo "false" > needs_migration.txt
          fi
          
          # Count potential transformations
          transformation_count=0
          for transform in ${migration_config.transformations[@]}; do
            count=$(npx codemod@next jssg \
              --pattern "${transform.pattern}" \
              --dry-run \
              src/ 2>/dev/null | grep -c "matches" || echo "0")
            echo "Pattern '${transform.pattern}': $count matches"
            transformation_count=$((transformation_count + count))
          done
          
          echo "Total transformations needed: $transformation_count"
          echo "$transformation_count" > transformation_count.txt

  - id: migrate-repository
    name: "Migrate repository"
    type: automatic
    depends_on: [analyze-repositories]
    matrix:
      repo: !state repositories
    condition: "$(cat repos/${repo.name}/needs_migration.txt) == 'true'"
    steps:
      - run: |
          cd "repos/${repo.name}"
          
          echo "Starting migration for ${repo.name}"
          
          # Create migration branch
          git checkout -b "migration-${migration_config.to_version}-$(date +%Y%m%d)"
          
          # Apply each transformation
          for transform in ${migration_config.transformations[@]}; do
            echo "Applying transformation: ${transform.pattern} -> ${transform.rewrite}"
            
            npx codemod@next jssg \
              --pattern "${transform.pattern}" \
              --rewrite "${transform.rewrite}" \
              src/
          done
          
          # Update package.json version
          sed -i "s/${migration_config.from_version}/${migration_config.to_version}/g" package.json
          
          # Install dependencies and test
          npm install
          npm test || {
            echo "Tests failed for ${repo.name}"
            exit 1
          }
          
          # Commit changes
          git add .
          git commit -m "feat: migrate to ${migration_config.to_version}
          
          - Updated dependencies from ${migration_config.from_version} to ${migration_config.to_version}
          - Applied automated code transformations
          - All tests passing"
          
          git push origin "migration-${migration_config.to_version}-$(date +%Y%m%d)"

  - id: create-pull-requests
    name: "Create pull request"
    type: automatic
    depends_on: [migrate-repository]
    matrix:
      repo: !state repositories
    condition: "$(cat repos/${repo.name}/needs_migration.txt) == 'true'"
    steps:
      - run: |
          cd "repos/${repo.name}"
          
          transformation_count=$(cat transformation_count.txt)
          
          gh pr create \
            --title "Migration to ${migration_config.to_version}" \
            --body "## Migration Summary
          
          This PR migrates the codebase from ${migration_config.from_version} to ${migration_config.to_version}.
          
          ### Changes Made
          - Updated package.json dependencies
          - Applied $transformation_count automated code transformations
          - All tests are passing
          - Linting is clean
          
          ### Transformations Applied
          $(for transform in ${migration_config.transformations[@]}; do
            echo "- \`${transform.pattern}\` → \`${transform.rewrite}\`"
          done)
          
          ### Testing
          - ✅ Unit tests pass
          - ✅ Linting passes
          - ✅ Type checking passes
          
          This migration was automatically generated using codemod workflows." \
            --base "${repo.branch}" \
            --head "migration-${migration_config.to_version}-$(date +%Y%m%d)"

---

# ==============================================
# Code Quality Improvement Workflow
# ==============================================

version: 1

state:
  quality_rules: !array
    items: !object
      properties:
        name: !string
        pattern: !string
        rewrite: !string
        severity: !string
        description: !string
  thresholds: !object
    properties:
      max_errors: !number
      max_warnings: !number

nodes:
  - id: quality-assessment
    name: "Assess current code quality"
    type: automatic
    steps:
      - run: |
          echo "Assessing current code quality..."
          
          # Run linting
          npm run lint --silent > lint-report.txt || true
          error_count=$(grep -c "error" lint-report.txt || echo "0")
          warning_count=$(grep -c "warning" lint-report.txt || echo "0")
          
          echo "Current errors: $error_count"
          echo "Current warnings: $warning_count"
          echo "Max allowed errors: ${thresholds.max_errors}"
          echo "Max allowed warnings: ${thresholds.max_warnings}"
          
          if [ "$error_count" -gt "${thresholds.max_errors}" ] || [ "$warning_count" -gt "${thresholds.max_warnings}" ]; then
            echo "Code quality below threshold, applying improvements..."
            echo "true" > needs_improvement.txt
          else
            echo "Code quality meets standards"
            echo "false" > needs_improvement.txt
          fi

  - id: apply-quality-improvements
    name: "Apply quality improvement"
    type: automatic
    depends_on: [quality-assessment]
    condition: "$(cat needs_improvement.txt) == 'true'"
    matrix:
      rule: !state quality_rules
    steps:
      - run: |
          echo "Applying quality rule: ${rule.name}"
          echo "Severity: ${rule.severity}"
          echo "Description: ${rule.description}"
          
          # Preview changes
          matches=$(npx codemod@next jssg \
            --pattern "${rule.pattern}" \
            --dry-run \
            src/ 2>/dev/null | grep -c "matches" || echo "0")
          
          if [ "$matches" -gt "0" ]; then
            echo "Found $matches instances to fix"
            
            # Apply transformation
            npx codemod@next jssg \
              --pattern "${rule.pattern}" \
              --rewrite "${rule.rewrite}" \
              src/
            
            echo "Applied ${rule.name} transformation"
          else
            echo "No instances found for ${rule.name}"
          fi

  - id: verify-improvements
    name: "Verify quality improvements"
    type: automatic
    depends_on: [apply-quality-improvements]
    condition: "$(cat needs_improvement.txt) == 'true'"
    steps:
      - run: |
          echo "Verifying quality improvements..."
          
          # Run linting again
          npm run lint --silent > lint-report-after.txt || true
          error_count_after=$(grep -c "error" lint-report-after.txt || echo "0")
          warning_count_after=$(grep -c "warning" lint-report-after.txt || echo "0")
          
          error_count_before=$(grep -c "error" lint-report.txt || echo "0")
          warning_count_before=$(grep -c "warning" lint-report.txt || echo "0")
          
          echo "Errors: $error_count_before → $error_count_after"
          echo "Warnings: $warning_count_before → $warning_count_after"
          
          errors_reduced=$((error_count_before - error_count_after))
          warnings_reduced=$((warning_count_before - warning_count_after))
          
          echo "Reduced errors by: $errors_reduced"
          echo "Reduced warnings by: $warnings_reduced"
          
          # Run tests to ensure no regressions
          npm test || {
            echo "Tests failed after quality improvements"
            exit 1
          }
          
          echo "Quality improvements successful!"

  - id: generate-report
    name: "Generate quality improvement report"
    type: automatic
    depends_on: [verify-improvements]
    condition: "$(cat needs_improvement.txt) == 'true'"
    steps:
      - run: |
          cat > quality-report.md << 'EOF'
          # Code Quality Improvement Report
          
          ## Summary
          Applied automated code quality improvements using codemod transformations.
          
          ## Improvements Applied
          $(for rule in ${quality_rules[@]}; do
            echo "### ${rule.name}"
            echo "- **Pattern:** \`${rule.pattern}\`"
            echo "- **Fix:** \`${rule.rewrite}\`"
            echo "- **Severity:** ${rule.severity}"
            echo "- **Description:** ${rule.description}"
            echo ""
          done)
          
          ## Results
          - **Errors reduced:** $errors_reduced
          - **Warnings reduced:** $warnings_reduced
          - **Tests status:** ✅ All passing
          
          ## Next Steps
          - Review the changes
          - Consider adding these patterns to your linting rules
          - Schedule regular quality improvement workflows
          EOF
          
          echo "Quality improvement report generated: quality-report.md"