# Quarto Project Configuration Examples

# Website Project Configuration
# File: _quarto.yml
project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!draft.qmd"
    - "!temp/"

website:
  title: "My Website"
  description: "A Quarto website"
  navbar:
    background: primary
    search: true
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - text: "More"
        menu:
          - href: blog.qmd
            text: Blog
          - href: projects.qmd
            text: Projects
    right:
      - icon: github
        href: https://github.com/username/repo
        aria-label: GitHub
      - icon: twitter
        href: https://twitter.com/username
        aria-label: Twitter
  
  sidebar:
    style: "docked"
    search: true
    contents:
      - section: "Guide"
        contents:
          - text: "Introduction"
            href: intro.qmd
          - text: "Getting Started"
            href: getting-started.qmd
      - section: "Reference"
        contents:
          - text: "API"
            href: api.qmd

  page-footer:
    left: "Copyright 2024, Author Name"
    right:
      - text: "License"
        href: license.qmd
      - text: "Code of Conduct"
        href: conduct.qmd

format:
  html:
    theme: 
      - cosmo
      - custom.scss
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    highlight-style: github
    code-fold: true
    code-tools: true
    code-copy: true
    smooth-scroll: true

execute:
  cache: true
  freeze: auto
  daemon: 60

---

# Book Project Configuration
# File: _quarto.yml
project:
  type: book
  output-dir: _book

book:
  title: "My Book Title"
  subtitle: "A Comprehensive Guide"
  author: "Author Name"
  date: "2024-01-01"
  description: "Detailed description of the book content"
  
  chapters:
    - index.qmd
    - part: "Part I: Foundations"
      chapters:
        - intro.qmd
        - basics.qmd
    - part: "Part II: Advanced Topics"  
      chapters:
        - advanced.qmd
        - expert.qmd
    - summary.qmd
    - references.qmd
  
  appendices:
    - appendix-a.qmd
    - appendix-b.qmd

  downloads: [pdf, epub]
  sharing: [twitter, facebook, linkedin]
  
  sidebar:
    logo: "logo.png"
    search: true

format:
  html:
    theme: cosmo
    cover-image: cover.png
    toc: true
  pdf:
    documentclass: scrbook
    classoption: [twoside, openright]
    geometry: 
      - top=1in
      - bottom=1in
      - left=1.2in
      - right=0.8in
    fontfamily: libertinus
    fontsize: 11pt
    include-in-header:
      - preamble.tex
  epub:
    cover-image: cover.png

---

# Presentation Configuration
# File: presentation.qmd
format:
  revealjs:
    theme: dark
    transition: slide
    transition-speed: fast
    slide-number: true
    chalkboard: 
      buttons: false
    preview-links: auto
    incremental: true
    footer: "My Presentation"
    logo: "logo.png"
    css: custom.css
    width: 1280
    height: 720
    margin: 0.1
    min-scale: 0.2
    max-scale: 2.0
    controls: true
    progress: true
    hash: true
    history: false
    keyboard: true
    touch: true
    loop: false
    rtl: false
    navigation-mode: default
    code-fold: true
    code-overflow: wrap
    code-line-numbers: true

---

# Dashboard Configuration
# File: dashboard.qmd
format: 
  dashboard:
    theme: cosmo
    orientation: columns
    nav-buttons: [github, twitter]
    logo: logo.png
    scrolling: true

server: shiny

---

# Academic Paper Configuration
# File: paper.qmd
format:
  pdf:
    documentclass: article
    classoption: [12pt, letterpaper]
    geometry: margin=1in
    fontfamily: times
    linestretch: 2
    bibliography: references.bib
    csl: apa-style.csl
    cite-method: citeproc
    number-sections: true
    colorlinks: true
    include-in-header:
      - header.tex
    include-before-body:
      - before.tex
    include-after-body:
      - after.tex
  html:
    theme: journal
    toc: true
    number-sections: true
    bibliography: references.bib
    csl: apa-style.csl

execute:
  echo: false
  warning: false
  message: false
  cache: true

---

# Publishing Configuration
# File: _publish.yml
- source: project
  netlify:
    - id: "site-id-here"
      url: "https://example.netlify.app"

- source: project
  gh-pages:
    - id: "github-pages"
      url: "https://username.github.io/repo"

- source: project
  connect:
    - id: "connect-id"
      url: "https://connect.example.com/content/123/"

---

# Computational Configuration Examples

# Python Environment
execute:
  engine: jupyter
  cache: refresh
  freeze: auto
  daemon: 300
  keep-md: true
  ipynb-filters:
    - remove_outputs

# R Environment  
execute:
  engine: knitr
  cache: true
  fig-width: 8
  fig-height: 6
  fig-dpi: 300
  warning: false
  message: false

# Julia Environment
execute:
  engine: julia
  cache: true
  eval: true