# /etc/dnsmasq.conf
# netboot.xyz DHCP and TFTP configuration

# DHCP Configuration
dhcp-range=192.168.1.100,192.168.1.200,255.255.255.0,12h
dhcp-option=option:router,192.168.1.1
dhcp-option=option:dns-server,8.8.8.8,8.8.4.4

# TFTP Configuration
enable-tftp
tftp-root=/var/lib/tftp

# PXE Boot Configuration
# Replace SERVER_IP_ADDRESS with your netboot.xyz server IP

# Standard PC BIOS
dhcp-match=set:bios,60,PXEClient:Arch:00000
dhcp-boot=tag:bios,netboot.xyz.kpxe,,SERVER_IP_ADDRESS

# 32-bit EFI
dhcp-match=set:efi32,60,PXEClient:Arch:00002
dhcp-boot=tag:efi32,netboot.xyz.efi,,SERVER_IP_ADDRESS

# 32-bit EFI (obsolete)
dhcp-match=set:efi32-1,60,PXEClient:Arch:00006
dhcp-boot=tag:efi32-1,netboot.xyz.efi,,SERVER_IP_ADDRESS

# 64-bit EFI
dhcp-match=set:efi64,60,PXEClient:Arch:00007
dhcp-boot=tag:efi64,netboot.xyz.efi,,SERVER_IP_ADDRESS

# 64-bit EFI (obsolete)
dhcp-match=set:efi64-1,60,PXEClient:Arch:00008
dhcp-boot=tag:efi64-1,netboot.xyz.efi,,SERVER_IP_ADDRESS

# 64-bit EFI (newer)
dhcp-match=set:efi64-2,60,PXEClient:Arch:00009
dhcp-boot=tag:efi64-2,netboot.xyz.efi,,SERVER_IP_ADDRESS

# ARM64 EFI
dhcp-match=set:efi64-3,60,PXEClient:Arch:0000B
dhcp-boot=tag:efi64-3,netboot.xyz-arm64.efi,,SERVER_IP_ADDRESS

# Optional: TFTP server IP
dhcp-option=66,"SERVER_IP_ADDRESS"