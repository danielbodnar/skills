# Kickstart configuration for automated CentOS/Rocky/AlmaLinux installation
# Serve this file from a web server and reference in iPXE boot line
# Example: inst.ks=http://my.kickstart.com/ks.cfg

# Installation method
url --url="http://dl.rockylinux.org/pub/rocky/9/BaseOS/x86_64/os/"

# System language and keyboard
lang en_US.UTF-8
keyboard us

# Network configuration
network --bootproto=dhcp --device=eth0 --onboot=yes --hostname=netboot-test

# Root password (use encrypted password in production)
rootpw --iscrypted $6$rounds=4096$salt$hashedpassword

# System timezone
timezone UTC --utc

# System authorization
auth --enableshadow --passalgo=sha512

# Use text mode install
text

# SELinux configuration
selinux --enforcing

# Firewall configuration
firewall --enabled --service=ssh

# System services
services --enabled=sshd,chronyd

# Disk partitioning
zerombr
clearpart --all --initlabel
autopart --type=lvm

# Bootloader configuration
bootloader --location=mbr --boot-drive=sda

# Reboot after installation
reboot

# Package selection
%packages --ignoremissing
@core
@base
openssh-server
chrony
vim
curl
wget
%end

# Post-installation scripts
%post --log=/var/log/kickstart-post.log

# Update system
dnf update -y

# Configure SSH
systemctl enable sshd
systemctl start sshd

# Add custom configurations here
echo "Installation completed via netboot.xyz kickstart" > /etc/motd

%end