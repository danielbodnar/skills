# Ubuntu Autoinstall Configuration
# Serve this file from a web server accessible during installation
# Reference in iPXE: autoinstall ds=nocloud-net;s=http://my.autoinstall.com/

#cloud-config
autoinstall:
  version: 1
  
  # Locale and keyboard
  locale: en_US.UTF-8
  keyboard:
    layout: us
  
  # Network configuration
  network:
    network:
      version: 2
      ethernets:
        eth0:
          dhcp4: true
          dhcp-identifier: mac
  
  # Storage configuration
  storage:
    layout:
      name: lvm
      sizing-policy: scaled
      reset-partition-table: true
  
  # Identity configuration
  identity:
    hostname: netboot-ubuntu
    username: ubuntu
    password: '$6$rounds=4096$salt$hashedpassword'
    
  # SSH configuration
  ssh:
    install-server: true
    allow-pw: true
    authorized-keys:
      - ssh-rsa AAAAB3... your-public-key-here
  
  # Package configuration
  packages:
    - curl
    - wget
    - vim
    - git
    - htop
    - net-tools
    - openssh-server
  
  # Snaps
  snaps:
    - name: core
    - name: snapd
  
  # User data
  user-data:
    timezone: UTC
    package_update: true
    package_upgrade: true
    
    # Run commands after installation
    runcmd:
      - systemctl enable ssh
      - systemctl start ssh
      - echo "Ubuntu installed via netboot.xyz autoinstall" > /etc/motd
      
    # Power state
    power_state:
      mode: reboot
      timeout: 30
      condition: true
  
  # Late commands (run in installer environment)
  late-commands:
    - echo 'ubuntu ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/ubuntu
    - chmod 440 /target/etc/sudoers.d/ubuntu