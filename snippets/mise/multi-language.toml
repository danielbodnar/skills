# Multi-Language Project Configuration

min_version = "2024.9.5"

# =============================================================================
# TOOLS FOR DIFFERENT LANGUAGES
# =============================================================================

[tools]
# JavaScript/TypeScript
node = "22"
npm = "latest"
yarn = "latest"
pnpm = "latest"
"npm:typescript" = "latest"
"npm:eslint" = "latest"
"npm:prettier" = "latest"

# Python
python = { version = "3.11", virtualenv = ".venv" }
"pipx:black" = "latest"
"pipx:flake8" = "latest"
"pipx:mypy" = "latest"
"pipx:pytest" = "latest"

# Ruby
ruby = "3.3"
bundler = "latest"

# Go
go = "1.21"
"go:github.com/golangci/golangci-lint/cmd/golangci-lint" = "latest"

# Rust
rust = "stable"
"cargo:cargo-edit" = "latest"
"cargo:cargo-watch" = "latest"

# Java
java = "21"
maven = "latest"
gradle = "latest"

# PHP
php = "8.3"
composer = "latest"

# C/C++
cmake = "latest"
make = "latest"
gcc = "latest"

# DevOps tools
terraform = "latest"
kubectl = "latest"
helm = "latest"
docker = "latest"
"cargo:just" = "latest"

# Database tools
"go:github.com/golang-migrate/migrate/v4/cmd/migrate" = "latest"
"npm:prisma" = "latest"

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================

[env]
# Project metadata
PROJECT_NAME = "{{ config_root | basename }}"
PROJECT_ROOT = "{{ config_root }}"

# Language-specific paths
_.path = [
  "{{ config_root }}/bin",
  "{{ config_root }}/scripts",
  "{{ config_root }}/node_modules/.bin",
]

# Python
PYTHONPATH = "{{ config_root }}/src/python"
_.python.venv = { path = ".venv", create = true }

# Node.js
NODE_ENV = "{{ env.NODE_ENV | default(value='development') }}"
NODE_OPTIONS = "--max-old-space-size=4096"

# Go
GOPATH = "{{ config_root }}/go"
GO111MODULE = "on"

# Rust
CARGO_TARGET_DIR = "{{ config_root }}/target"

# Java
JAVA_OPTS = "-Xmx2g -Xms512m"
MAVEN_OPTS = "-Xmx1g"

# =============================================================================
# LANGUAGE-SPECIFIC TASKS
# =============================================================================

# JavaScript/Node.js tasks
[tasks.js-install]
description = "Install JavaScript dependencies"
run = "npm install"
dir = "frontend"

[tasks.js-dev]
description = "Start JavaScript development server"
run = "npm run dev"
dir = "frontend"
env = { NODE_ENV = "development" }

[tasks.js-test]
description = "Run JavaScript tests"
run = "npm test"
dir = "frontend"

[tasks.js-build]
description = "Build JavaScript application"
run = "npm run build"
dir = "frontend"
env = { NODE_ENV = "production" }

# Python tasks
[tasks.py-install]
description = "Install Python dependencies"
run = "pip install -r requirements.txt"
dir = "backend"

[tasks.py-dev]
description = "Start Python development server"
run = "python manage.py runserver"
dir = "backend"
env = { DJANGO_ENV = "development" }

[tasks.py-test]
description = "Run Python tests"
run = "pytest"
dir = "backend"

[tasks.py-lint]
description = "Lint Python code"
run = [
  "black --check .",
  "flake8 .",
  "mypy .",
]
dir = "backend"

# Go tasks
[tasks.go-install]
description = "Download Go dependencies"
run = "go mod download"
dir = "api"

[tasks.go-dev]
description = "Start Go development server"
run = "go run main.go"
dir = "api"

[tasks.go-test]
description = "Run Go tests"
run = "go test ./..."
dir = "api"

[tasks.go-build]
description = "Build Go application"
run = "go build -o bin/api main.go"
dir = "api"

[tasks.go-lint]
description = "Lint Go code"
run = "golangci-lint run"
dir = "api"

# Rust tasks
[tasks.rust-dev]
description = "Start Rust development server"
run = "cargo watch -x run"
dir = "core"

[tasks.rust-test]
description = "Run Rust tests"
run = "cargo test"
dir = "core"

[tasks.rust-build]
description = "Build Rust application"
run = "cargo build --release"
dir = "core"

[tasks.rust-lint]
description = "Lint Rust code"
run = "cargo clippy -- -D warnings"
dir = "core"

# Database tasks
[tasks.db-migrate]
description = "Run database migrations"
run = "migrate -path migrations -database $DATABASE_URL up"

[tasks.db-seed]
description = "Seed database"
run = "python scripts/seed.py"
dir = "backend"

# Docker tasks
[tasks.docker-build]
description = "Build all Docker images"
run = [
  "docker build -t app-frontend frontend/",
  "docker build -t app-backend backend/",
  "docker build -t app-api api/",
]

[tasks.docker-up]
description = "Start all services with Docker Compose"
run = "docker-compose up -d"

[tasks.docker-down]
description = "Stop all services"
run = "docker-compose down"

# =============================================================================
# COMPOSITE TASKS
# =============================================================================

[tasks.install-all]
description = "Install all dependencies"
run = [
  "mise run js-install",
  "mise run py-install", 
  "mise run go-install",
]

[tasks.test-all]
description = "Run all tests"
run = [
  "mise run js-test",
  "mise run py-test",
  "mise run go-test",
  "mise run rust-test",
]

[tasks.lint-all]
description = "Lint all code"
run = [
  "mise run py-lint",
  "mise run go-lint", 
  "mise run rust-lint",
]

[tasks.build-all]
description = "Build all applications"
run = [
  "mise run js-build",
  "mise run go-build",
  "mise run rust-build",
]

[tasks.dev-all]
description = "Start all development servers"
run = [
  "mise run js-dev",
  "mise run py-dev", 
  "mise run go-dev",
]

[tasks.ci]
description = "Run full CI pipeline"
depends = ["install-all", "lint-all", "test-all", "build-all"]
run = "echo 'CI pipeline completed successfully'"

# =============================================================================
# ENVIRONMENT-SPECIFIC TASKS
# =============================================================================

[tasks.dev]
description = "Start development environment"
run = [
  "mise run docker-up",
  "sleep 5",  # Wait for services to start
  "mise run db-migrate",
  "mise run dev-all",
]

[tasks.prod-build]
description = "Production build"
env = { NODE_ENV = "production" }
run = [
  "mise run build-all",
  "mise run docker-build",
]

[tasks.deploy]
description = "Deploy to production"
confirm = "Deploy to production?"
depends = ["test-all", "prod-build"]
run = [
  "docker-compose -f docker-compose.prod.yml up -d",
]