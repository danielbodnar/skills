# Comprehensive Task Examples for mise.toml

[vars]
# Shared variables
build_dir = "dist"
test_pattern = "**/*.test.{js,ts}"
docker_registry = "registry.example.com"
app_name = "myapp"

[tasks.install]
description = "Install dependencies"
alias = "i"
run = "npm install"

[tasks.clean]
description = "Clean build artifacts"
run = [
  "rm -rf {{ vars.build_dir }}",
  "rm -rf node_modules/.cache",
  "rm -rf .next",
]

[tasks.dev]
description = "Start development server"
alias = "d"
env = { NODE_ENV = "development", DEBUG = "true" }
run = "npm run dev"

[tasks.test]
description = "Run tests"
alias = "t"
env = { NODE_ENV = "test" }
run = "jest {{ vars.test_pattern }}"
sources = ["src/**/*.{js,ts}", "tests/**/*.{js,ts}"]

[tasks.test-watch]
description = "Run tests in watch mode"
env = { NODE_ENV = "test" }
run = "jest --watch {{ vars.test_pattern }}"

[tasks.lint]
description = "Run linting"
run = [
  "eslint src/",
  "prettier --check src/",
  "tsc --noEmit",
]
sources = ["src/**/*.{js,ts,tsx}", "*.{js,ts}"]

[tasks.lint-fix]
description = "Fix linting issues"
run = [
  "eslint src/ --fix",
  "prettier --write src/",
]

[tasks.type-check]
description = "Run TypeScript type checking"
run = "tsc --noEmit"
sources = ["src/**/*.{ts,tsx}", "tsconfig.json"]

[tasks.build]
description = "Build for production"
alias = "b"
env = { NODE_ENV = "production" }
run = "npm run build"
sources = ["src/**/*", "package.json", "vite.config.ts"]
outputs = ["{{ vars.build_dir }}/**/*"]
depends = ["lint", "type-check"]

[tasks.preview]
description = "Preview production build"
run = "npm run preview"
depends = ["build"]

[tasks.docker-build]
description = "Build Docker image"
run = "docker build -t {{ vars.docker_registry }}/{{ vars.app_name }}:latest ."
depends = ["build"]

[tasks.docker-run]
description = "Run Docker container locally"
run = "docker run -p 3000:3000 {{ vars.docker_registry }}/{{ vars.app_name }}:latest"
depends = ["docker-build"]

[tasks.deploy-staging]
description = "Deploy to staging"
env = { DEPLOY_ENV = "staging" }
run = [
  "mise run build",
  "mise run docker-build",
  "docker tag {{ vars.docker_registry }}/{{ vars.app_name }}:latest {{ vars.docker_registry }}/{{ vars.app_name }}:staging",
  "docker push {{ vars.docker_registry }}/{{ vars.app_name }}:staging",
]
depends = ["test"]

[tasks.deploy-prod]
description = "Deploy to production"
confirm = "Are you sure you want to deploy to production?"
env = { DEPLOY_ENV = "production" }
run = [
  "mise run build",
  "mise run docker-build",
  "docker push {{ vars.docker_registry }}/{{ vars.app_name }}:latest",
]
depends = ["test"]

[tasks.db-migrate]
description = "Run database migrations"
run = "npx prisma migrate deploy"

[tasks.db-seed]
description = "Seed database"
run = "npx prisma db seed"
depends = ["db-migrate"]

[tasks.db-reset]
description = "Reset database"
confirm = "This will delete all data. Continue?"
run = [
  "npx prisma migrate reset --force",
  "mise run db-seed",
]

[tasks.security-audit]
description = "Run security audit"
run = [
  "npm audit --audit-level high",
  "npx audit-ci --moderate",
]

[tasks.performance-test]
description = "Run performance tests"
run = "npm run test:performance"
env = { NODE_ENV = "test" }

[tasks.e2e]
description = "Run end-to-end tests"
run = "npx playwright test"
depends = ["build"]

[tasks.ci]
description = "Run CI pipeline"
run = [
  "mise run install",
  "mise run lint",
  "mise run type-check",
  "mise run test",
  "mise run build",
  "mise run e2e",
]

[tasks.release]
description = "Create release"
confirm = "Ready to create a new release?"
run = [
  "npm version patch",
  "git push origin main --tags",
  "mise run deploy-prod",
]
depends = ["ci"]

# File-based tasks example
[tasks.custom-script]
description = "Run custom script"
file = "scripts/custom.sh"

# Task with usage specification
[tasks.greet]
description = "Greet someone"
usage = '''
flag "-g --greeting <greeting>" help="Greeting to use" default="hello"
flag "-u --user <user>" help="User to greet"
arg "<message>" help="Message to display"
'''
run = '''
echo "$usage_greeting $usage_user! $usage_message"
'''

# Platform-specific tasks
[tasks.build-windows]
description = "Build for Windows"
run_windows = "npm run build:win"
run = "npm run build"

# Tasks with different working directories
[tasks.backend-test]
description = "Test backend"
dir = "backend"
run = "npm test"

[tasks.frontend-test]
description = "Test frontend"
dir = "frontend"
run = "npm test"

# Parallel task execution
[tasks.test-all]
description = "Run all tests in parallel"
run = "mise run backend-test ::: frontend-test ::: e2e"