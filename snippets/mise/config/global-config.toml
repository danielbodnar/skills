# Global mise configuration (~/.config/mise/config.toml)
# This file contains global settings and tools available across all projects

[settings]
# Auto-install tools when not found
not_found_auto_install = true

# Number of parallel jobs
jobs = 4

# Always keep downloads after installation
always_keep_download = false

# Verbose output
verbose = false

# Task output format ("prefix" or "interleave")
task_output = "prefix"

# Auto-update plugins check duration
plugin_autoupdate_last_check_duration = "7d"

# Disable specific backends
# disable_backends = ["asdf"]

# Disable specific tools
# disable_tools = ["node", "python"]

# Enable paranoid mode (extra security checks)
paranoid = false

# =============================================================================
# GLOBAL TOOLS
# =============================================================================

[tools]
# Essential development tools
jq = "latest"
curl = "latest"
wget = "latest"
tree = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
exa = "latest"

# Version control
git = "latest"
gh = "latest"

# Container tools
docker = "latest"
kubectl = "latest"
helm = "latest"

# Infrastructure tools
terraform = "latest"
packer = "latest"

# Build tools
make = "latest"
cmake = "latest"

# Package managers that are commonly needed
npm = "latest"
yarn = "latest"
pip = "latest"

# Language servers and formatters
"npm:typescript-language-server" = "latest"
"npm:prettier" = "latest"
"npm:eslint" = "latest"
"pipx:black" = "latest"
"pipx:ruff" = "latest"
"cargo:stylua" = "latest"

# Utilities
"npm:http-server" = "latest"
"npm:serve" = "latest"
"cargo:just" = "latest"
"go:github.com/charmbracelet/glow" = "latest"

# =============================================================================
# GLOBAL ENVIRONMENT VARIABLES
# =============================================================================

[env]
# Editor settings
EDITOR = "{{ env.EDITOR | default(value='vim') }}"
VISUAL = "{{ env.VISUAL | default(value='vim') }}"

# Pager settings
PAGER = "less"
LESS = "-R"

# Development settings
FORCE_COLOR = "1"
NO_UPDATE_NOTIFIER = "1"

# Language-specific global settings
NODE_OPTIONS = "--max-old-space-size=4096"
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUNBUFFERED = "1"
CARGO_INCREMENTAL = "1"
RUSTC_WRAPPER = "sccache"

# Mise-specific settings
MISE_EXPERIMENTAL = "1"
MISE_ASDF_COMPAT = "1"

# =============================================================================
# GLOBAL TASKS
# =============================================================================

[tasks.update-tools]
description = "Update all global tools"
run = "mise upgrade --bump"

[tasks.doctor]
description = "Run mise doctor to check installation"
run = "mise doctor"

[tasks.clean-cache]
description = "Clean mise cache"
run = "rm -rf ~/.cache/mise"

[tasks.list-tools]
description = "List all installed tools"
run = "mise ls"

[tasks.shell-setup]
description = "Setup shell integration"
run = [
  "echo 'Adding mise activation to shell config...'",
  "grep -q 'mise activate' ~/.bashrc || echo 'eval \"$(mise activate bash)\"' >> ~/.bashrc",
  "grep -q 'mise activate' ~/.zshrc || echo 'eval \"$(mise activate zsh)\"' >> ~/.zshrc",
  "echo 'Shell setup complete. Restart your shell or source your rc file.'",
]

# =============================================================================
# SHORTHANDS AND ALIASES
# =============================================================================

# Custom shorthands for commonly used tools
[shorthands]
node = "core:node"
python = "core:python"
ruby = "core:ruby"
go = "core:go"
rust = "core:rust"
java = "core:java"

# Backend aliases
rg = "cargo:ripgrep"
fd = "cargo:fd-find"
bat = "cargo:bat"
exa = "cargo:exa"
delta = "cargo:git-delta"

# =============================================================================
# TRUSTED CONFIG PATHS
# =============================================================================

# Automatically trust certain directories
[trusted_config_paths]
paths = [
  "~/projects",
  "~/work",
  "~/src",
  "/workspaces",
]