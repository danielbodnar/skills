# Project Templates for Different Types

# =============================================================================
# NODE.JS/TYPESCRIPT PROJECT
# =============================================================================

# Example: mise.toml for TypeScript web application
[tools]
node = "22"
npm = "latest"
"npm:typescript" = "latest"
"npm:eslint" = "latest"
"npm:prettier" = "latest"
"npm:jest" = "latest"

[env]
NODE_ENV = "{{ env.NODE_ENV | default(value='development') }}"
PORT = "{{ env.PORT | default(value='3000') }}"
PROJECT_NAME = "{{ config_root | basename }}"

[tasks.install]
alias = "i"
description = "Install dependencies"
run = "npm install"

[tasks.dev]
alias = "d"
description = "Start development server"
run = "npm run dev"

[tasks.test]
alias = "t"
description = "Run tests"
run = "npm test"

[tasks.build]
alias = "b"
description = "Build for production"
run = "npm run build"

[tasks.lint]
description = "Run linting"
run = ["eslint src/", "prettier --check src/"]

# =============================================================================
# PYTHON/DJANGO PROJECT
# =============================================================================

# Example: mise.toml for Python Django application
[tools]
python = { version = "3.11", virtualenv = ".venv" }
"pipx:black" = "latest"
"pipx:flake8" = "latest"
"pipx:pytest" = "latest"
"pipx:django" = "latest"

[env]
DJANGO_SETTINGS_MODULE = "{{ config_root | basename }}.settings"
DATABASE_URL = "postgresql://localhost/{{ config_root | basename }}_{{ env.DJANGO_ENV | default(value='development') }}"
SECRET_KEY = "{{ env.SECRET_KEY | default(value='dev-secret-key') }}"

[tasks.install]
description = "Install dependencies"
run = "pip install -r requirements.txt"

[tasks.migrate]
description = "Run database migrations"
run = "python manage.py migrate"

[tasks.runserver]
description = "Start development server"
run = "python manage.py runserver"

[tasks.test]
description = "Run tests"
run = "pytest"

[tasks.shell]
description = "Start Django shell"
run = "python manage.py shell"

# =============================================================================
# RUST PROJECT
# =============================================================================

# Example: mise.toml for Rust application
[tools]
rust = "stable"
"cargo:cargo-edit" = "latest"
"cargo:cargo-watch" = "latest"
"cargo:cargo-audit" = "latest"

[env]
RUST_BACKTRACE = "1"
CARGO_TARGET_DIR = "target"

[tasks.dev]
description = "Start development with hot reload"
run = "cargo watch -x run"

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks.build]
description = "Build release"
run = "cargo build --release"

[tasks.lint]
description = "Run clippy"
run = "cargo clippy -- -D warnings"

[tasks.audit]
description = "Security audit"
run = "cargo audit"

# =============================================================================
# GO PROJECT
# =============================================================================

# Example: mise.toml for Go application
[tools]
go = "1.21"
"go:github.com/golangci/golangci-lint/cmd/golangci-lint" = "latest"
"go:github.com/air-verse/air" = "latest"

[env]
GOPATH = "{{ config_root }}/go"
GO111MODULE = "on"
CGO_ENABLED = "0"

[tasks.dev]
description = "Start development with hot reload"
run = "air"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.build]
description = "Build application"
run = "go build -o bin/app main.go"

[tasks.lint]
description = "Run linting"
run = "golangci-lint run"

# =============================================================================
# FULL-STACK PROJECT
# =============================================================================

# Example: mise.toml for full-stack application
[tools]
node = "22"
python = { version = "3.11", virtualenv = "backend/.venv" }
go = "1.21"
terraform = "latest"
docker = "latest"

[env]
# Frontend
FRONTEND_PORT = "3000"
FRONTEND_DIR = "frontend"

# Backend
BACKEND_PORT = "8000"
BACKEND_DIR = "backend"

# API
API_PORT = "8080"
API_DIR = "api"

# Database
DATABASE_URL = "postgresql://localhost/{{ config_root | basename }}"

[tasks.install-frontend]
description = "Install frontend dependencies"
dir = "frontend"
run = "npm install"

[tasks.install-backend]
description = "Install backend dependencies"
dir = "backend"
run = "pip install -r requirements.txt"

[tasks.install-api]
description = "Install API dependencies"
dir = "api"
run = "go mod download"

[tasks.install]
description = "Install all dependencies"
depends = ["install-frontend", "install-backend", "install-api"]

[tasks.dev-frontend]
description = "Start frontend development"
dir = "frontend"
run = "npm run dev"

[tasks.dev-backend]
description = "Start backend development"
dir = "backend"
run = "python manage.py runserver"

[tasks.dev-api]
description = "Start API development"
dir = "api"
run = "go run main.go"

[tasks.dev]
description = "Start all development servers"
run = [
  "mise run dev-frontend &",
  "mise run dev-backend &", 
  "mise run dev-api &",
  "wait"
]

# =============================================================================
# MICROSERVICES PROJECT
# =============================================================================

# Example: mise.toml for microservices architecture
[tools]
node = "22"
python = "3.11"
go = "1.21"
docker = "latest"
kubectl = "latest"
helm = "latest"

[env]
DOCKER_REGISTRY = "registry.example.com"
NAMESPACE = "{{ env.ENVIRONMENT | default(value='development') }}"

[tasks.build-user-service]
description = "Build user service"
dir = "services/user"
run = "docker build -t ${DOCKER_REGISTRY}/user-service:latest ."

[tasks.build-auth-service]
description = "Build auth service"
dir = "services/auth"
run = "docker build -t ${DOCKER_REGISTRY}/auth-service:latest ."

[tasks.build-api-gateway]
description = "Build API gateway"
dir = "services/gateway"
run = "docker build -t ${DOCKER_REGISTRY}/api-gateway:latest ."

[tasks.build-all]
description = "Build all services"
depends = ["build-user-service", "build-auth-service", "build-api-gateway"]

[tasks.deploy-dev]
description = "Deploy to development"
run = "helm upgrade --install app ./charts/app --namespace dev"

[tasks.deploy-prod]
description = "Deploy to production"
confirm = "Deploy to production?"
run = "helm upgrade --install app ./charts/app --namespace prod"

# =============================================================================
# STATIC SITE PROJECT
# =============================================================================

# Example: mise.toml for static site generator
[tools]
node = "22"
"npm:@astro/cli" = "latest"
"npm:prettier" = "latest"
"npm:eslint" = "latest"

[env]
NODE_ENV = "{{ env.NODE_ENV | default(value='development') }}"
SITE_URL = "{{ env.SITE_URL | default(value='http://localhost:3000') }}"

[tasks.dev]
description = "Start development server"
run = "astro dev"

[tasks.build]
description = "Build static site"
run = "astro build"

[tasks.preview]
description = "Preview built site"
run = "astro preview"

[tasks.deploy]
description = "Deploy to production"
depends = ["build"]
run = "rsync -av dist/ user@server:/var/www/html/"

# =============================================================================
# MOBILE APP PROJECT
# =============================================================================

# Example: mise.toml for React Native project
[tools]
node = "22"
"npm:react-native-cli" = "latest"
"npm:@react-native-community/cli" = "latest"
java = "17"

[env]
ANDROID_HOME = "{{ env.ANDROID_HOME }}"
JAVA_HOME = "{{ env.JAVA_HOME }}"

[tasks.install]
description = "Install dependencies"
run = "npm install"

[tasks.android]
description = "Run on Android"
run = "npx react-native run-android"

[tasks.ios]
description = "Run on iOS"
run = "npx react-native run-ios"

[tasks.build-android]
description = "Build Android APK"
run = "cd android && ./gradlew assembleRelease"

[tasks.build-ios]
description = "Build iOS app"
run = "cd ios && xcodebuild -workspace App.xcworkspace -scheme App archive"