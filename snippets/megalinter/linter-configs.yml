# MegaLinter Linter-Specific Configuration Examples

# === JavaScript/TypeScript Linters ===

# ESLint Configuration
# File: .eslintrc.json
{
  "env": {
    "browser": true,
    "es2024": true,
    "node": true
  },
  "extends": [
    "eslint:recommended",
    "@typescript-eslint/recommended",
    "prettier"
  ],
  "parser": "@typescript-eslint/parser",
  "parserOptions": {
    "ecmaVersion": "latest",
    "sourceType": "module",
    "project": "./tsconfig.json"
  },
  "plugins": ["@typescript-eslint"],
  "rules": {
    "no-console": "warn",
    "@typescript-eslint/no-unused-vars": "error",
    "@typescript-eslint/explicit-function-return-type": "warn"
  },
  "ignorePatterns": ["dist/", "node_modules/", "*.config.js"]
}

# Prettier Configuration
# File: .prettierrc.json
{
  "semi": true,
  "trailingComma": "es5",
  "singleQuote": true,
  "printWidth": 80,
  "tabWidth": 2,
  "useTabs": false,
  "bracketSpacing": true,
  "arrowParens": "avoid",
  "endOfLine": "lf"
}

# File: .prettierignore
node_modules/
dist/
build/
coverage/
*.min.js
*.min.css

---
# === Python Linters ===

# Black Configuration
# File: pyproject.toml
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# Pylint Configuration
# File: .pylintrc
[MASTER]
load-plugins = pylint_django
django-settings-module = myproject.settings

[MESSAGES CONTROL]
disable = C0111,R0903,R0902,W0613

[FORMAT]
max-line-length = 88
indent-string = '    '

[VARIABLES]
good-names = i,j,k,ex,Run,_,id,pk

[DESIGN]
max-args = 7
max-locals = 15
max-returns = 6
max-branches = 12
max-statements = 50

# Flake8 Configuration
# File: setup.cfg
[flake8]
max-line-length = 88
extend-ignore = E203, E266, E501, W503
max-complexity = 10
select = B,C,E,F,W,T4,B9
exclude = 
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist

# MyPy Configuration
# File: mypy.ini
[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

[mypy-tests.*]
disallow_untyped_defs = False

# Bandit Security Configuration
# File: .bandit
[bandit]
exclude_dirs = ["*/tests/*", "*/venv/*"]
skips = ["B101", "B601"]

---
# === Go Linters ===

# golangci-lint Configuration
# File: .golangci.yml
run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters-settings:
  govet:
    check-shadowing: true
  golint:
    min-confidence: 0.8
  gocyclo:
    min-complexity: 15
  maligned:
    suggest-new: true
  dupl:
    threshold: 100
  goconst:
    min-len: 2
    min-occurrences: 2
  misspell:
    locale: US
  lll:
    line-length: 140
  goimports:
    local-prefixes: github.com/myorg/myproject
  gocritic:
    enabled-tags:
      - performance
      - style
      - experimental
    disabled-checks:
      - wrapperFunc

linters:
  enable:
    - bodyclose
    - deadcode
    - depguard
    - dogsled
    - dupl
    - errcheck
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - gofmt
    - goimports
    - golint
    - gomnd
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - ineffassign
    - interfacer
    - lll
    - misspell
    - nakedret
    - rowserrcheck
    - scopelint
    - staticcheck
    - structcheck
    - stylecheck
    - typecheck
    - unconvert
    - unparam
    - unused
    - varcheck
    - whitespace

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gomnd
        - goconst

---
# === Markdown and Documentation ===

# markdownlint Configuration
# File: .markdownlint.json
{
  "default": true,
  "MD013": {
    "line_length": 120,
    "code_blocks": false,
    "tables": false
  },
  "MD033": {
    "allowed_elements": ["details", "summary", "img"]
  },
  "MD041": false,
  "MD029": {
    "style": "ordered"
  }
}

# markdownlint-cli2 Configuration
# File: .markdownlint-cli2.jsonc
{
  "config": {
    "MD013": {
      "line_length": 120
    },
    "MD033": {
      "allowed_elements": ["details", "summary"]
    }
  },
  "globs": [
    "**/*.md"
  ],
  "ignores": [
    "node_modules",
    "CHANGELOG.md"
  ]
}

---
# === YAML Linters ===

# yamllint Configuration
# File: .yamllint.yml
extends: default

rules:
  line-length:
    max: 120
    level: warning
  comments:
    min-spaces-from-content: 2
  comments-indentation: disable
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false

ignore: |
  /.github/
  /node_modules/
  /.venv/

---
# === Docker Linters ===

# hadolint Configuration
# File: .hadolint.yaml
failure-threshold: warning
format: json

ignored:
  - DL3008  # Pin versions in apt get install
  - DL3009  # Delete the apt-get lists after installing
  - DL3015  # Avoid additional packages by specifying --no-install-recommends

trustedRegistries:
  - docker.io
  - gcr.io
  - registry.hub.docker.com

override:
  error:
    - DL3020
  warning:
    - DL3019
  info:
    - DL3032

---
# === JSON Linters ===

# JSON Schema Validation
# File: .jsonlint.json
{
  "indent": 2,
  "sort-keys": true,
  "trailing-comma": false
}

---
# === CSS/SCSS Linters ===

# stylelint Configuration
# File: .stylelintrc.json
{
  "extends": [
    "stylelint-config-standard",
    "stylelint-config-prettier"
  ],
  "plugins": [
    "stylelint-scss",
    "stylelint-order"
  ],
  "rules": {
    "indentation": 2,
    "string-quotes": "single",
    "no-duplicate-selectors": true,
    "color-hex-case": "lower",
    "color-hex-length": "short",
    "selector-combinator-space-after": "always",
    "selector-attribute-quotes": "always",
    "selector-attribute-operator-space-before": "never",
    "selector-attribute-operator-space-after": "never",
    "selector-attribute-brackets-space-inside": "never",
    "declaration-block-trailing-semicolon": "always",
    "declaration-colon-space-before": "never",
    "declaration-colon-space-after": "always",
    "number-leading-zero": "always",
    "function-url-quotes": "always",
    "comment-whitespace-inside": "always",
    "rule-empty-line-before": "always-multi-line",
    "selector-pseudo-element-colon-notation": "double",
    "selector-pseudo-class-parentheses-space-inside": "never",
    "media-feature-range-operator-space-before": "always",
    "media-feature-range-operator-space-after": "always"
  },
  "ignoreFiles": [
    "dist/**/*",
    "build/**/*",
    "node_modules/**/*"
  ]
}

---
# === Shell Script Linters ===

# shellcheck Configuration
# File: .shellcheckrc
# Disable specific warnings
disable=SC2034,SC2086,SC2155

# Enable additional checks
enable=all

# Set shell dialect
shell=bash

# External sources
external-sources=true

---
# === SQL Linters ===

# sqlfluff Configuration
# File: .sqlfluff
[sqlfluff]
dialect = postgres
templater = jinja
sql_file_exts = .sql,.sql.j2,.dml,.ddl

[sqlfluff:indentation]
indent_unit = space
tab_space_size = 4

[sqlfluff:layout:type:comma]
spacing_before = touch
line_position = trailing

[sqlfluff:rules:capitalisation.keywords]
capitalisation_policy = upper

[sqlfluff:rules:capitalisation.identifiers]
extended_capitalisation_policy = lower

---
# === Terraform Linters ===

# tflint Configuration
# File: .tflint.hcl
config {
  format = "compact"
  plugin_dir = "~/.tflint.d/plugins"
}

plugin "aws" {
  enabled = true
  version = "0.21.0"
  source  = "github.com/terraform-linters/tflint-ruleset-aws"
}

rule "terraform_deprecated_interpolation" {
  enabled = true
}

rule "terraform_unused_declarations" {
  enabled = true
}

rule "terraform_comment_syntax" {
  enabled = true
}

rule "terraform_documented_outputs" {
  enabled = true
}

rule "terraform_documented_variables" {
  enabled = true
}

rule "terraform_typed_variables" {
  enabled = true
}

rule "terraform_module_pinned_source" {
  enabled = true
}

rule "terraform_naming_convention" {
  enabled = true
  format  = "snake_case"
}

rule "terraform_standard_module_structure" {
  enabled = true
}

---
# === Kubernetes Linters ===

# kubeval Configuration
# This tool validates Kubernetes YAML files against schemas

# kube-score Configuration
# File: .kube-score.yaml
ignore:
  - ingress-targets-service
  - service-targets-pod
  - container-security-context-user-group-id
  - container-security-context-privileged
  - container-resources
  - pod-networkpolicy
  - networkpolicy-targets-pod

---
# === Security Linters ===

# Semgrep Configuration
# File: .semgrep.yml
rules:
  - id: hardcoded-secret
    pattern: |
      password = "..."
    message: Hardcoded secret detected
    languages: [python, javascript, typescript]
    severity: ERROR

  - id: sql-injection
    pattern: |
      execute("SELECT * FROM users WHERE id = " + $VAR)
    message: Potential SQL injection
    languages: [python, javascript, java]
    severity: ERROR

  - id: xss-vulnerability
    pattern: |
      innerHTML = $VAR
    message: Potential XSS vulnerability
    languages: [javascript, typescript]
    severity: WARNING

# TruffleHog Configuration
# File: .trufflehogignore
# Ignore test files and mock data
test/**
tests/**
spec/**
*.test.js
*.spec.ts
mock/**
fixtures/**

# Ignore documentation
README.md
CHANGELOG.md
docs/**

---
# === Multi-Language Configuration ===

# MegaLinter Global Configuration
# File: .mega-linter.yml with all linter configs
APPLY_FIXES: all
DEFAULT_BRANCH: main
FILEIO_REPORTER: true
SHOW_ELAPSED_TIME: true
PARALLEL: true

# Language-specific config files
JAVASCRIPT_ES_CONFIG_FILE: .eslintrc.json
JAVASCRIPT_PRETTIER_CONFIG_FILE: .prettierrc.json
TYPESCRIPT_ES_CONFIG_FILE: .eslintrc.json
TYPESCRIPT_PRETTIER_CONFIG_FILE: .prettierrc.json
PYTHON_BLACK_CONFIG_FILE: pyproject.toml
PYTHON_PYLINT_CONFIG_FILE: .pylintrc
PYTHON_FLAKE8_CONFIG_FILE: setup.cfg
PYTHON_MYPY_CONFIG_FILE: mypy.ini
GO_GOLANGCI_LINT_CONFIG_FILE: .golangci.yml
MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .markdownlint.json
YAML_YAMLLINT_CONFIG_FILE: .yamllint.yml
DOCKERFILE_HADOLINT_CONFIG_FILE: .hadolint.yaml
CSS_STYLELINT_CONFIG_FILE: .stylelintrc.json

# Custom arguments for linters
JAVASCRIPT_ES_ARGUMENTS: "--max-warnings 0 --cache"
PYTHON_PYLINT_ARGUMENTS: "--load-plugins=pylint_django --max-line-length=88"
GO_GOLANGCI_LINT_ARGUMENTS: "--timeout=10m --enable-all"
DOCKERFILE_HADOLINT_ARGUMENTS: "--failure-threshold warning"

# Filter configurations
FILTER_REGEX_EXCLUDE: "(node_modules/|\\.git/|dist/|build/|coverage/)"
JAVASCRIPT_FILTER_REGEX_EXCLUDE: "(test/|spec/|__tests__/)"
PYTHON_FILTER_REGEX_EXCLUDE: "(test_|tests/|__pycache__/)"
GO_FILTER_REGEX_EXCLUDE: "(vendor/|_test\\.go$)"