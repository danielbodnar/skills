# Basic MegaLinter GitHub Actions Workflow
# File: .github/workflows/megalinter.yml

name: MegaLinter

on:
  # Trigger on push to main branches
  push:
    branches: [main, master, develop]
  
  # Trigger on pull requests to main branches
  pull_request:
    branches: [main, master]
  
  # Allow manual triggering
  workflow_dispatch:

# Cancel previous runs if new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    
    # Required permissions for MegaLinter
    permissions:
      contents: read      # To checkout the repository
      issues: write       # To create issues for reports  
      pull-requests: write # To comment on PRs
      statuses: write     # To set commit statuses
      security-events: write # To upload SARIF results
    
    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Personal Access Token for auto-fix commits
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          # Fetch full history for better analysis
          fetch-depth: 0

      # Run MegaLinter
      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter@v8
        env:
          # Validate all code for pushes to main, only changes for PRs
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Basic configuration
          APPLY_FIXES: all
          PARALLEL: true
          SHOW_ELAPSED_TIME: true
          
          # Enable file reports
          FILEIO_REPORTER: true
          
          # Enable multiple report formats
          REPORTERS: console,github_comment,github_status,sarif,json
          
          # Performance optimization
          FILTER_REGEX_EXCLUDE: "(node_modules/|\\.git/|dist/|build/|coverage/)"

      # Upload MegaLinter artifacts
      - name: Archive production artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log
          retention-days: 30

      # Upload SARIF results to GitHub Security tab
      - name: Upload SARIF file
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: megalinter-reports/megalinter-report.sarif
        continue-on-error: true

      # Auto-commit fixes (only on pull requests)
      - name: Create Pull Request with fixes
        id: cpr
        if: >
          steps.ml.outputs.has_updated_sources == 1 &&
          github.event_name == 'pull_request' &&
          env.APPLY_FIXES_EVENT == 'pull_request'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          commit-message: "[MegaLinter] Apply linters automatic fixes"
          title: "[MegaLinter] Apply linters automatic fixes"
          body: |
            This PR contains automatic fixes applied by MegaLinter.
            
            **Updated sources:**
            ${{ steps.ml.outputs.updated_sources }}
            
            **Linters that applied fixes:**
            - ESLint
            - Prettier
            - Black (Python)
            - gofmt (Go)
            
            Please review the changes and merge if they look correct.
          labels: |
            bot
            megalinter
            auto-fix
          branch: megalinter-fixes
          delete-branch: true

      # Add PR comment with summary
      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `
            ## MegaLinter Results 📊
            
            **Status:** ${{ steps.ml.outcome == 'success' && '✅ Passed' || '❌ Failed' }}
            **Files processed:** ${{ steps.ml.outputs.total_files || 'N/A' }}
            **Linters executed:** ${{ steps.ml.outputs.total_linters || 'N/A' }}
            **Errors found:** ${{ steps.ml.outputs.total_errors || '0' }}
            
            ${{ steps.ml.outputs.has_updated_sources == 1 && '🔧 **Auto-fixes available** - Check the artifacts or the auto-fix PR.' || '' }}
            
            📋 [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # Set job summary
      - name: Job Summary
        if: always()
        run: |
          echo "## MegaLinter Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.ml.outcome == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Files processed:** ${{ steps.ml.outputs.total_files || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Linters executed:** ${{ steps.ml.outputs.total_linters || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Errors found:** ${{ steps.ml.outputs.total_errors || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.ml.outputs.has_updated_sources }}" == "1" ]]; then
            echo "🔧 **Auto-fixes were applied**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 [View artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY