# === JavaScript/TypeScript Flavor Workflow ===
# File: .github/workflows/megalinter-javascript.yml
name: MegaLinter JavaScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  megalinter:
    name: MegaLinter JavaScript
    runs-on: ubuntu-latest
