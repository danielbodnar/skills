      - name: Upload MegaLinter artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log

---
# === Matrix Strategy for Multiple Flavors ===
# File: .github/workflows/megalinter-matrix.yml
name: MegaLinter Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor:
          - javascript
          - python
          - go
        include:
          - flavor: javascript
            directory: frontend
          - flavor: python
            directory: backend
          - flavor: go
            directory: services
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/${{ matrix.flavor }}@v8
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER_REGEX_INCLUDE: "${{ matrix.directory }}"
          APPLY_FIXES: all

---
# === Scheduled Security Scan ===
# File: .github/workflows/security-scan.yml
name: Security Scan

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: MegaLinter Security
        uses: oxsecurity/megalinter@v8
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_LINTERS: |
            REPOSITORY_TRUFFLEHOG,
            REPOSITORY_SEMGREP,
            PYTHON_BANDIT,
            DOCKERFILE_HADOLINT
          SARIF_REPORTER: true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: megalinter-reports/megalinter-report.sarif

---
# === Conditional Workflow ===
# File: .github/workflows/megalinter-conditional.yml
name: MegaLinter Conditional

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      javascript: ${{ steps.changes.outputs.javascript }}
      python: ${{ steps.changes.outputs.python }}
      docker: ${{ steps.changes.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            javascript:
              - 'src/**/*.js'
              - 'src/**/*.ts'
              - 'package*.json'
            python:
              - '**/*.py'
              - 'requirements*.txt'
              - 'pyproject.toml'
            docker:
              - '**/Dockerfile'
              - '**/docker-compose*.yml'

  megalinter-js:
    needs: changes
    if: ${{ needs.changes.outputs.javascript == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: MegaLinter JavaScript
        uses: oxsecurity/megalinter/flavors/javascript@v8
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  megalinter-python:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: MegaLinter Python
        uses: oxsecurity/megalinter/flavors/python@v8
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

---
# === Performance Optimized Workflow ===
# File: .github/workflows/megalinter-optimized.yml
name: MegaLinter Optimized

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Cache MegaLinter
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/megalinter
            ~/.npm
            ~/.cache/pip
          key: ${{ runner.os }}-megalinter-${{ hashFiles('**/package-lock.json', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-megalinter-

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter/flavors/javascript@v8
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARALLEL: true
          SHOW_ELAPSED_TIME: true
          FILTER_REGEX_EXCLUDE: "(node_modules/|\\.git/|dist/|build/)"
          APPLY_FIXES: all

---
# === Custom Reporter Workflow ===
# File: .github/workflows/megalinter-custom-reports.yml
name: MegaLinter with Custom Reports

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter@v8
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORTERS: |
            console,
            github_comment,
            github_status,
            sarif,
            json,
            html
          FILEIO_REPORTER: true
          REPORT_OUTPUT_FOLDER: reports

      - name: Publish HTML Report
        uses: peaceiris/actions-gh-pages@v4
        if: success() || failure()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          destination_dir: reports/${{ github.run_number }}

      - name: Comment PR with Report Link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📊 MegaLinter Report: https://${context.repo.owner}.github.io/${context.repo.repo}/reports/${context.runNumber}/`
            })

---
# === Environment-Specific Workflow ===
# File: .github/workflows/megalinter-environments.yml
name: MegaLinter Multi-Environment

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Environment Variables
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "VALIDATE_ALL_CODEBASE=true" >> $GITHUB_ENV
            echo "APPLY_FIXES=none" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "develop" ]]; then
            echo "VALIDATE_ALL_CODEBASE=false" >> $GITHUB_ENV
            echo "APPLY_FIXES=all" >> $GITHUB_ENV
          else
            echo "VALIDATE_ALL_CODEBASE=false" >> $GITHUB_ENV
            echo "APPLY_FIXES=none" >> $GITHUB_ENV
          fi

      - name: MegaLinter
        uses: oxsecurity/megalinter@v8
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: ${{ env.VALIDATE_ALL_CODEBASE }}
          APPLY_FIXES: ${{ env.APPLY_FIXES }}