# WireGuard Configuration File
# File: /etc/wireguard/wg0.conf

[Interface]
# Local configuration
PrivateKey = <PRIVATE_KEY>
Address = 10.0.0.1/24
ListenPort = 51820

# Optional: DNS for this interface
DNS = 8.8.8.8, 8.8.4.4

# Optional: Post-up and post-down scripts
PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

[Peer]
# Remote peer configuration
PublicKey = <PEER_PUBLIC_KEY>
AllowedIPs = 10.0.0.2/32
Endpoint = <PEER_IP>:51820

# Optional: Persistent keepalive for NAT traversal
PersistentKeepalive = 25

# Road warrior configuration example
# [Peer]
# PublicKey = <CLIENT_PUBLIC_KEY>
# AllowedIPs = 10.0.0.0/24
# 
# [Peer]
# PublicKey = <ANOTHER_CLIENT_PUBLIC_KEY>
# AllowedIPs = 10.0.0.3/32

# Site-to-site VPN example
# [Peer]
# PublicKey = <SITE_B_PUBLIC_KEY>
# AllowedIPs = 192.168.2.0/24
# Endpoint = site-b.example.com:51820
# PersistentKeepalive = 25