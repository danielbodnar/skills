# VyOS BGP Configuration Commands
# Configure BGP routing protocol

# Set system AS number
set protocols bgp system-as 65001

# Configure BGP router ID
set protocols bgp parameters router-id 192.168.1.1

# IPv4 Unicast Configuration
set protocols bgp address-family ipv4-unicast network 192.168.1.0/24
set protocols bgp address-family ipv4-unicast network 10.0.0.0/8

# BGP Neighbors
set protocols bgp neighbor 192.168.1.2 remote-as 65002
set protocols bgp neighbor 192.168.1.2 description 'External BGP Peer'
set protocols bgp neighbor 192.168.1.2 address-family ipv4-unicast

# iBGP Neighbor
set protocols bgp neighbor 10.0.0.2 remote-as 65001
set protocols bgp neighbor 10.0.0.2 description 'iBGP Peer'
set protocols bgp neighbor 10.0.0.2 update-source 'lo'
set protocols bgp neighbor 10.0.0.2 address-family ipv4-unicast

# IPv6 BGP Configuration
set protocols bgp address-family ipv6-unicast network 2001:db8:1::/64
set protocols bgp neighbor 2001:db8::2 remote-as 65002
set protocols bgp neighbor 2001:db8::2 address-family ipv6-unicast

# L2VPN EVPN Configuration
set protocols bgp address-family l2vpn-evpn neighbor 192.168.1.2 activate
set protocols bgp address-family l2vpn-evpn advertise-all-vni
set protocols bgp address-family l2vpn-evpn advertise-default-gw

# Route Filtering with Prefix Lists
set policy prefix-list EXPORT-LIST rule 10 action permit
set policy prefix-list EXPORT-LIST rule 10 prefix 192.168.1.0/24
set policy prefix-list EXPORT-LIST rule 20 action permit
set policy prefix-list EXPORT-LIST rule 20 prefix 10.0.0.0/8
set policy prefix-list EXPORT-LIST rule 100 action deny
set policy prefix-list EXPORT-LIST rule 100 prefix any

# Route Maps
set policy route-map EXPORT-FILTER rule 10 action permit
set policy route-map EXPORT-FILTER rule 10 match ip address prefix-list EXPORT-LIST
set policy route-map EXPORT-FILTER rule 10 set metric 100

# Apply Route Map to Neighbor
set protocols bgp neighbor 192.168.1.2 address-family ipv4-unicast route-map export EXPORT-FILTER

# BGP Communities
set policy community-list CUSTOMER rule 10 action permit
set policy community-list CUSTOMER rule 10 regex '65001:100'

# Route Redistribution
set protocols bgp address-family ipv4-unicast redistribute connected metric 50
set protocols bgp address-family ipv4-unicast redistribute static metric 100

# BGP Parameters
set protocols bgp parameters bestpath as-path multipath-relax
set protocols bgp parameters bestpath compare-routerid
set protocols bgp address-family ipv4-unicast maximum-paths ebgp 4
set protocols bgp address-family ipv4-unicast maximum-paths ibgp 4

# Commit configuration
commit
save