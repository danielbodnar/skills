! FRRouting OSPF Configuration
! File: /etc/frr/frr.conf

frr version 8.5
frr defaults traditional
hostname ospf-router
log syslog informational
service integrated-vtysh-config

! OSPF Configuration
router ospf
 ospf router-id 192.168.1.1
 log-adjacency-changes detail
 
 ! Area 0 (Backbone)
 area 0 authentication message-digest
 
 ! Area 1 (Stub Area)
 area 1 stub
 area 1 default-cost 100
 
 ! Area 2 (NSSA)
 area 2 nssa
 
 ! Network Statements
 network 192.168.1.0/24 area 0
 network 10.0.0.0/24 area 0
 network 172.16.1.0/24 area 1
 network 172.16.2.0/24 area 2
 
 ! Passive Interfaces
 passive-interface default
 no passive-interface eth0
 no passive-interface eth1
 
 ! Redistribute Connected Routes
 redistribute connected metric 20 metric-type 1
 
 ! Default Route Origination
 default-information originate always metric 10

! Interface-specific OSPF Configuration
interface eth0
 description "To Area 0"
 ip ospf message-digest-key 1 md5 ospf_password
 ip ospf cost 10
 ip ospf hello-interval 5
 ip ospf dead-interval 20
 ip ospf priority 100

interface eth1
 description "To Area 1"
 ip ospf cost 20
 ip ospf network point-to-point

interface lo0
 description "Loopback"
 ip ospf area 0

! OSPFv3 for IPv6
router ospf6
 ospf6 router-id 192.168.1.1
 log-adjacency-changes detail
 
 area 0 range 2001:db8::/32
 
 interface eth0 area 0
 interface eth1 area 1
 interface lo0 area 0

interface eth0
 ipv6 ospf6 cost 10
 ipv6 ospf6 hello-interval 5
 ipv6 ospf6 dead-interval 20

! Access Lists for Route Filtering
access-list 10 permit 192.168.1.0 0.0.0.255
access-list 10 deny any

! Route Maps for Redistribution
route-map REDIS-CONNECTED permit 10
 match ip address 10
 set metric 50

line vty