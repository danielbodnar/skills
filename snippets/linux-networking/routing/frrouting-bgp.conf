! FRRouting BGP Configuration
! File: /etc/frr/frr.conf

frr version 8.5
frr defaults traditional
hostname router1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! BGP Configuration
router bgp 65001
 bgp router-id 192.168.1.1
 
 ! IPv4 Unicast Address Family
 address-family ipv4 unicast
  network 192.168.1.0/24
  network 10.0.0.0/8
  
  ! Neighbor Configuration
  neighbor 192.168.1.2 remote-as 65002
  neighbor 192.168.1.2 description "Peer Router"
  neighbor 192.168.1.2 update-source 192.168.1.1
  neighbor 192.168.1.2 next-hop-self
  
  ! iBGP Neighbor
  neighbor 10.0.0.2 remote-as 65001
  neighbor 10.0.0.2 description "iBGP Peer"
  neighbor 10.0.0.2 update-source lo0
  
  ! Route Map Application
  neighbor 192.168.1.2 route-map FILTER-OUT out
  neighbor 192.168.1.2 route-map FILTER-IN in
 exit-address-family
 
 ! IPv6 Unicast Address Family
 address-family ipv6 unicast
  network 2001:db8:1::/64
  neighbor 2001:db8::2 remote-as 65002
  neighbor 2001:db8::2 activate
 exit-address-family

! L2VPN EVPN Configuration
 address-family l2vpn evpn
  neighbor 192.168.1.2 activate
  neighbor 192.168.1.2 route-reflector-client
  advertise-all-vni
 exit-address-family

! Route Maps
route-map FILTER-OUT permit 10
 match ip address prefix-list ALLOW-OUT
 set metric 100

route-map FILTER-IN permit 10
 match ip address prefix-list ALLOW-IN
 set local-preference 200

! Prefix Lists
ip prefix-list ALLOW-OUT seq 10 permit 192.168.1.0/24
ip prefix-list ALLOW-OUT seq 20 permit 10.0.0.0/8

ip prefix-list ALLOW-IN seq 10 permit 192.168.2.0/24
ip prefix-list ALLOW-IN seq 20 deny any

! Community Lists
bgp community-list standard CUSTOMER permit 65001:100
bgp community-list standard PEER permit 65001:200

! Static Routes (if needed)
ip route 0.0.0.0/0 192.168.1.254

line vty