# GritQL Configuration Examples

# Basic .grit/grit.yaml configuration
version: 0.0.2
patterns:
  # Remove console.log statements
  - name: no_console_log
    title: "Remove console.log statements"
    body: |
      `console.log($_)` => .
    level: error
    tags: ["debugging", "production"]
    description: "Removes console.log statements to clean up production code"

  # Convert var to const
  - name: prefer_const
    title: "Prefer const over var"
    body: |
      `var $name = $value` => `const $name = $value` where {
        $value <: not or {
          assignment_expression(),
          update_expression()
        }
      }
    level: warn
    tags: ["es6", "style"]
    description: "Convert var declarations to const when variable is not reassigned"

  # Add missing semicolons
  - name: add_semicolons
    title: "Add missing semicolons"
    body: |
      `$statement` => `$statement;` where {
        $statement <: or {
          expression_statement(),
          return_statement()
        },
        $statement <: not contains `;`
      }
    level: info
    tags: ["style", "formatting"]
    description: "Adds missing semicolons to JavaScript statements"

  # Remove unused variables
  - name: no_unused_vars
    title: "Remove unused variables"
    body: |
      `let $name = $value` => . where {
        $name <: not within any {
          identifier(),
          member_expression(),
          call_expression()
        }
      }
    level: warn
    tags: ["cleanup", "optimization"]
    description: "Removes variables that are declared but never used"

  # Convert to arrow functions
  - name: prefer_arrow_functions
    title: "Prefer arrow functions"
    body: |
      `function $name($params) { return $expr }` => `const $name = ($params) => $expr`
    level: info
    tags: ["es6", "style"]
    description: "Convert simple functions to arrow function syntax"

  # Update jQuery to vanilla JS
  - name: jquery_to_vanilla
    title: "Convert jQuery to vanilla JavaScript"
    body: |
      `$($selector)` => `document.querySelector($selector)`
    level: warn
    tags: ["modernization", "jquery"]
    description: "Replace jQuery selectors with native DOM methods"

  # Add error handling
  - name: add_try_catch
    title: "Add try-catch to async functions"
    body: |
      `async function $name($params) { $body }` => 
      `async function $name($params) {
        try {
          $body
        } catch (error) {
          console.error('Error in $name:', error);
          throw error;
        }
      }` where {
        $body <: not contains `try`
      }
    level: info
    tags: ["error-handling", "async"]
    description: "Add basic error handling to async functions"

  # Convert Promise.then to async/await
  - name: promise_to_async_await
    title: "Convert Promise.then to async/await"
    body: |
      `$promise.then($callback)` => `await $promise` where {
        $callback <: `($result) => $body`,
        $promise <: within async_function()
      }
    level: info
    tags: ["async", "modernization"]
    description: "Convert Promise.then chains to async/await syntax"

# Advanced configuration with imports and exclusions
patterns:
  # Pattern with import management
  - name: ensure_react_import
    title: "Ensure React import for JSX"
    body: |
      or {
        jsx_element(),
        jsx_fragment()
      } where {
        $_ <: not within contains `import React from 'react'`
      } => . where {
        file($f) <: ensure_import_from(source=`'react'`, import=`React`)
      }
    level: error
    tags: ["react", "imports"]
    description: "Ensures React is imported when JSX is used"

  # Pattern with file exclusions
  - name: no_any_type
    title: "Avoid any type in TypeScript"
    body: |
      `any` => `unknown` where {
        file($f) <: not contains `// @ts-ignore`,
        file($f) <: not or {
          ends_with(`.d.ts`),
          ends_with(`.test.ts`),
          ends_with(`.spec.ts`)
        }
      }
    level: warn
    tags: ["typescript", "type-safety"]
    description: "Replace any type with unknown for better type safety"

# Multi-language configuration
patterns:
  # Python patterns
  - name: python_f_strings
    title: "Use f-strings for string formatting"
    language: python
    body: |
      `"$template".format($args)` => `f"$template"` where {
        $template <: contains `{`,
        $args <: arguments()
      }
    level: info
    tags: ["python", "modernization"]
    description: "Convert .format() calls to f-string syntax"

  # Rust patterns  
  - name: rust_unwrap_to_expect
    title: "Replace unwrap with expect"
    language: rust
    body: |
      `$expr.unwrap()` => `$expr.expect("$msg")` where {
        $msg = `Failed to unwrap value`
      }
    level: warn
    tags: ["rust", "error-handling"]
    description: "Replace unwrap() with expect() for better error messages"

# Workflow configuration
workflows:
  - name: modernize_javascript
    description: "Modernize JavaScript codebase"
    patterns:
      - prefer_const
      - prefer_arrow_functions
      - add_semicolons
      - no_console_log
    
  - name: cleanup_code
    description: "Clean up and optimize code"
    patterns:
      - no_unused_vars
      - no_console_log
      - add_semicolons
    
  - name: migrate_jquery
    description: "Migrate from jQuery to vanilla JavaScript"
    patterns:
      - jquery_to_vanilla
      - ensure_react_import

# Global settings
settings:
  # Exclude certain directories
  exclude:
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - "coverage/**"
    - "*.min.js"
  
  # Include specific file patterns
  include:
    - "src/**/*.{js,ts,jsx,tsx}"
    - "lib/**/*.{js,ts}"
    - "test/**/*.{js,ts}"
  
  # Performance settings
  parallel: true
  max_threads: 4
  timeout: 30000 # 30 seconds
  
  # Output settings
  format: "unified"
  color: true
  verbose: false