#cloud-config
# Cloud-init configuration for Proxmox VE VMs

# Basic system configuration
hostname: ${hostname}
fqdn: ${hostname}.${domain}
manage_etc_hosts: true

# Package management
package_update: true
package_upgrade: true
package_reboot_if_required: true

packages:
  - curl
  - wget
  - git
  - htop
  - vim
  - net-tools
  - ufw
  - fail2ban
  - qemu-guest-agent
  - cloud-init
  - openssh-server

# User configuration
users:
  - name: ubuntu
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQ... # Replace with your public key
    lock_passwd: false
  - name: admin
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQ... # Replace with your public key

# SSH configuration
ssh_pwauth: false
disable_root: true
ssh_deletekeys: true
ssh_genkeytypes: [rsa, ecdsa, ed25519]

# Security settings
chpasswd:
  expire: false

# Firewall configuration
runcmd:
  # Enable and configure UFW
  - systemctl enable ufw
  - ufw --force enable
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ssh
  - ufw allow http
  - ufw allow https
  
  # Configure fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban
  
  # Enable QEMU guest agent
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent
  
  # Update system and clean up
  - apt-get autoremove -y
  - apt-get autoclean
  
  # Set timezone
  - timedatectl set-timezone UTC
  
  # Configure automatic security updates
  - echo 'Unattended-Upgrade::Automatic-Reboot "false";' >> /etc/apt/apt.conf.d/50unattended-upgrades
  - systemctl enable unattended-upgrades

# Network configuration (if not using DHCP)
# network:
#   version: 2
#   ethernets:
#     eth0:
#       dhcp4: false
#       addresses: [192.168.1.100/24]
#       gateway4: 192.168.1.1
#       nameservers:
#         addresses: [8.8.8.8, 8.8.4.4]

# File system configuration
write_files:
  # Custom motd
  - path: /etc/motd
    content: |
      Welcome to ${hostname}.${domain}
      
      This system is managed by Proxmox VE
      Provisioned with cloud-init and Terraform
      
      For support, contact: admin@${domain}
    owner: root:root
    permissions: '0644'
  
  # Custom fail2ban jail
  - path: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 3
      
      [sshd]
      enabled = true
      port = ssh
      logpath = /var/log/auth.log
      maxretry = 3
    owner: root:root
    permissions: '0644'
  
  # Custom sysctl configuration
  - path: /etc/sysctl.d/99-custom.conf
    content: |
      # Network security settings
      net.ipv4.ip_forward = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.conf.default.accept_source_route = 0
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.secure_redirects = 0
      net.ipv4.conf.default.secure_redirects = 0
      net.ipv4.conf.all.log_martians = 1
      net.ipv4.conf.default.log_martians = 1
      net.ipv4.icmp_echo_ignore_broadcasts = 1
      net.ipv4.icmp_ignore_bogus_error_responses = 1
      net.ipv4.tcp_syncookies = 1
    owner: root:root
    permissions: '0644'

# Service configuration
bootcmd:
  # Ensure cloud-init runs properly
  - cloud-init-per once ssh-users-ca echo "TrustedUserCAKeys /etc/ssh/trusted-user-ca-keys.pem" >> /etc/ssh/sshd_config

# Power management
power_state:
  delay: "now"
  mode: reboot
  message: "Rebooting after cloud-init setup"
  condition: true

# Final message
final_message: |
  Cloud-init setup completed successfully!
  System: ${hostname}.${domain}
  Time: $TIMESTAMP
  Uptime: $UPTIME
  
  The system will reboot to complete the setup process.