# ~/.cargo/config.toml - Global cargo-generate Configuration

[cargo-generate]
# Default author information
authors = ["Your Name <you@example.com>"]

# Favorite template shortcuts
[cargo-generate.favorites]
# WebAssembly templates
wasm = "https://github.com/rustwasm/wasm-pack-template"
wasm-game = "https://github.com/rustwasm/wasm_game_of_life"

# CLI application templates  
cli = "https://github.com/clap-rs/clap-derive-template"
cli-simple = "https://github.com/your-org/simple-cli-template"

# Library templates
lib = "https://github.com/rust-lang/library-template"
proc-macro = "https://github.com/your-org/proc-macro-template"

# Web framework templates
axum = "https://github.com/your-org/axum-template"
actix = "https://github.com/your-org/actix-template"
warp = "https://github.com/your-org/warp-template"

# Async/async templates
async-lib = "https://github.com/your-org/async-lib-template"
tokio-app = "https://github.com/your-org/tokio-app-template"

# Database templates
diesel = "https://github.com/your-org/diesel-template"
sqlx = "https://github.com/your-org/sqlx-template"

# Embedded templates
embedded = "https://github.com/rust-embedded/cortex-m-quickstart"
no-std = "https://github.com/your-org/no-std-template"

# Game development templates
bevy = "https://github.com/bevyengine/bevy-template"
macroquad = "https://github.com/your-org/macroquad-template"

# Default placeholder values
[cargo-generate.defaults]
license = "MIT"
rust_edition = "2021"
use_github_actions = true
use_dependabot = true
author_email = "you@example.com"
github_username = "your-username"

# Template-specific configurations
[cargo-generate.template-configs]
# Configuration for wasm templates
[cargo-generate.template-configs.wasm]
default_license = "Apache-2.0"
include_examples = true

# Configuration for CLI templates  
[cargo-generate.template-configs.cli]
default_features = ["clap", "anyhow", "tracing"]
include_completions = true

# Local template paths
[cargo-generate.local-templates]
my-template = "/path/to/my/local/template"
work-template = "/work/templates/rust-service"

# Git configuration for templates
[cargo-generate.git]
# Use SSH for private templates
use_ssh = true
# Default branch to use if not specified
default_branch = "main"

# HTTP configuration
[cargo-generate.http]  
# Timeout for HTTP requests (in seconds)
timeout = 30
# User agent for HTTP requests
user_agent = "cargo-generate/0.18.0"

# Cache configuration
[cargo-generate.cache]
# Enable template caching
enabled = true
# Cache directory (relative to cargo home)
directory = "generate-cache"
# Cache TTL in seconds (24 hours)
ttl = 86400