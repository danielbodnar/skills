# cargo-generate.toml - Template Configuration Examples

# Basic template metadata
[template]
cargo_generate_version = ">=0.18.0"
description = "A comprehensive Rust project template"
include = ["src/**", "tests/**", "benches/**"]
exclude = ["target/**", "*.tmp"]

# String placeholder with validation
[placeholders.project_description]
type = "string"
prompt = "Enter a brief project description"
default = "A new Rust project"
regex = "^.{10,200}$"

# Boolean placeholder
[placeholders.use_async]
type = "bool"
prompt = "Use async/await features?"
default = false

# Choice placeholder
[placeholders.license]
type = "string"
prompt = "Choose a license"
choices = ["MIT", "Apache-2.0", "GPL-3.0", "BSD-3-Clause"]
default = "MIT"

# Array placeholder
[placeholders.features]
type = "array"
prompt = "Select features to include (space-separated)"
choices = ["serde", "tokio", "clap", "anyhow", "tracing"]
default = []

# Editor placeholder for multiline content
[placeholders.readme_content]
type = "editor"
prompt = "Enter README content (opens your default editor)"
default = "# {{project-name}}\n\n{{project_description}}"

# Advanced string placeholder with complex validation
[placeholders.crate_name]
type = "string"
prompt = "Enter crate name (must be valid Rust identifier)"
default = "{{project-name | snake_case}}"
regex = "^[a-z][a-z0-9_]*$"

# Numeric placeholder (using string with validation)
[placeholders.rust_edition]
type = "string"
prompt = "Rust edition"
choices = ["2018", "2021"]
default = "2021"

# Email placeholder with validation
[placeholders.author_email]
type = "string"
prompt = "Author email"
default = "author@example.com"
regex = "^[^@]+@[^@]+\\.[^@]+$"

# URL placeholder
[placeholders.repository_url]
type = "string"
prompt = "Repository URL (optional)"
default = ""
regex = "^(https?://github\\.com/[^/]+/[^/]+)?$"

# Conditional file inclusion based on crate type
[conditional.'crate_type == "bin"']
ignore = ["src/lib.rs", "benches/**"]
include = ["src/main.rs"]

[conditional.'crate_type == "lib"']
ignore = ["src/main.rs"]
include = ["src/lib.rs", "benches/**"]

# Conditional inclusion based on boolean flags
[conditional.'use_async']
include = ["src/async.rs", "examples/async_example.rs"]

[conditional.'!use_async']
ignore = ["src/async.rs", "examples/async_example.rs"]

# Conditional inclusion based on array contents
[conditional.'"serde" in features']
include = ["src/serde_helpers.rs"]

[conditional.'!"tokio" in features']
ignore = ["src/tokio_utils.rs"]

# License-specific file inclusion
[conditional.'license == "MIT"']
include = ["LICENSE-MIT"]
ignore = ["LICENSE-APACHE", "LICENSE-GPL"]

[conditional.'license == "Apache-2.0"']
include = ["LICENSE-APACHE"]  
ignore = ["LICENSE-MIT", "LICENSE-GPL"]

[conditional.'license == "GPL-3.0"']
include = ["LICENSE-GPL"]
ignore = ["LICENSE-MIT", "LICENSE-APACHE"]

# Platform-specific conditionals
[conditional.'os == "windows"']
include = ["src/windows.rs", "build_windows.bat"]

[conditional.'os == "linux"']
include = ["src/linux.rs", "scripts/build.sh"]

# Architecture-specific conditionals  
[conditional.'arch == "x86_64"']
include = ["src/x86_extensions.rs"]

# Complex conditional with multiple conditions
[conditional.'crate_type == "bin" && "clap" in features']
include = ["src/cli.rs", "completions/**"]

# Template-specific hook configuration
[hooks]
pre = ["hooks/pre-generate.rhai"]
post = ["hooks/post-generate.rhai", "hooks/format.rhai"]