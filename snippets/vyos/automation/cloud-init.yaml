#cloud-config
# VyOS Cloud-Init Configuration Example

# Basic system configuration
hostname: vyos-cloud-router
fqdn: vyos-cloud-router.example.com

# SSH keys for secure access
ssh_authorized_keys:
  - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAACAQC... user@workstation
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI... admin@server

# VyOS specific configuration commands
vyos_config_commands:
  # System configuration
  - set system host-name 'vyos-cloud-router'
  - set system domain-name 'example.com'
  - set system time-zone 'UTC'
  
  # User management
  - set system login user admin authentication public-keys admin key 'AAAAB3NzaC1yc2EAAAADAQABAAACAQC...'
  - set system login user admin authentication public-keys admin type 'ssh-rsa'
  - set system login user admin level 'admin'
  
  # Interface configuration with cloud metadata
  - set interfaces ethernet eth0 address '192.168.1.1/24'
  - set interfaces ethernet eth0 description 'LAN Interface'
  - set interfaces ethernet eth1 address 'dhcp'
  - set interfaces ethernet eth1 description 'WAN Interface - Cloud Provider'
  
  # DNS and NTP
  - set system name-server '8.8.8.8'
  - set system name-server '8.8.4.4'
  - set system ntp server '0.pool.ntp.org'
  - set system ntp server '1.pool.ntp.org'
  
  # SSH service configuration
  - set service ssh port '22'
  - set service ssh disable-password-authentication
  - set service ssh listen-address '0.0.0.0'
  
  # Basic firewall
  - set firewall name OUTSIDE-IN default-action 'drop'
  - set firewall name OUTSIDE-IN rule 10 action 'accept'
  - set firewall name OUTSIDE-IN rule 10 state established 'enable'
  - set firewall name OUTSIDE-IN rule 10 state related 'enable'
  - set firewall name OUTSIDE-IN rule 20 action 'accept'
  - set firewall name OUTSIDE-IN rule 20 protocol 'icmp'
  - set firewall name OUTSIDE-IN rule 30 action 'accept'
  - set firewall name OUTSIDE-IN rule 30 destination port '22'
  - set firewall name OUTSIDE-IN rule 30 protocol 'tcp'
  
  # Apply firewall to WAN interface
  - set interfaces ethernet eth1 firewall in name 'OUTSIDE-IN'
  
  # NAT for internet access
  - set nat source rule 100 outbound-interface 'eth1'
  - set nat source rule 100 source address '192.168.1.0/24'
  - set nat source rule 100 translation address 'masquerade'
  
  # DHCP server
  - set service dhcp-server shared-network-name LAN subnet 192.168.1.0/24 default-router '192.168.1.1'
  - set service dhcp-server shared-network-name LAN subnet 192.168.1.0/24 dns-server '192.168.1.1'
  - set service dhcp-server shared-network-name LAN subnet 192.168.1.0/24 domain-name 'example.com'
  - set service dhcp-server shared-network-name LAN subnet 192.168.1.0/24 range 0 start '192.168.1.100'
  - set service dhcp-server shared-network-name LAN subnet 192.168.1.0/24 range 0 stop '192.168.1.200'
  
  # DNS forwarding
  - set service dns forwarding listen-address '192.168.1.1'
  - set service dns forwarding allow-from '192.168.1.0/24'
  - set service dns forwarding name-server '8.8.8.8'
  - set service dns forwarding name-server '8.8.4.4'

# Write custom configuration files
write_files:
  - path: /config/scripts/post-config.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # Post-configuration script
      logger "VyOS cloud-init post-config script started"
      
      # Configure additional services or settings here
      # Example: Update system packages
      sudo apt update && sudo apt upgrade -y
      
      # Example: Install additional packages
      # sudo apt install -y htop iftop
      
      logger "VyOS cloud-init post-config script completed"

# Run commands after cloud-init
runcmd:
  - /config/scripts/post-config.sh
  - logger "VyOS cloud-init configuration completed"

# Cloud-init modules to run
cloud_config_modules:
  - write-files
  - vyos

# Final message
final_message: "VyOS router cloud-init setup completed successfully"