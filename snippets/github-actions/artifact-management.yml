# Artifact Management and Storage
# Demonstrates comprehensive artifact handling, sharing, and management

name: Artifact Management

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Build and create multiple artifacts
  build-artifacts:
    runs-on: ubuntu-latest
    
    outputs:
      build-version: ${{ steps.version.outputs.version }}
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Get version
      id: version
      run: |
        VERSION=$(node -p "require('./package.json').version")
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: |
        npm run build
        npm run build:docs

    - name: Create build info
      run: |
        mkdir -p build-info
        echo "Version: ${{ steps.version.outputs.version }}" > build-info/version.txt
        echo "Built at: $(date)" > build-info/timestamp.txt
        echo "Commit: ${{ github.sha }}" > build-info/commit.txt
        echo "Branch: ${{ github.ref_name }}" > build-info/branch.txt

    - name: Generate package checksums
      run: |
        cd dist
        find . -type f -exec sha256sum {} \; > ../build-info/checksums.txt

    # Upload main build artifacts
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ steps.version.outputs.version }}
        path: |
          dist/
          !dist/**/*.map
        retention-days: 30
        compression-level: 6

    # Upload documentation separately
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation-${{ steps.version.outputs.version }}
        path: docs/
        retention-days: 7

    # Upload build metadata
    - name: Upload build info
      uses: actions/upload-artifact@v4
      with:
        name: build-info-${{ steps.version.outputs.version }}
        path: build-info/
        retention-days: 90

    # Upload source maps separately (for debugging)
    - name: Upload source maps
      uses: actions/upload-artifact@v4
      with:
        name: source-maps-${{ steps.version.outputs.version }}
        path: dist/**/*.map
        retention-days: 30

  # Test artifacts and generate test reports
  test-and-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage
      run: |
        npm run test:coverage
        npm run test:e2e

    - name: Generate test report
      if: always()
      run: |
        mkdir -p test-reports
        cp coverage/lcov-report/index.html test-reports/coverage-report.html
        cp playwright-report/index.html test-reports/e2e-report.html 2>/dev/null || echo "No E2E report"

    # Upload test coverage
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: |
          coverage/
          test-reports/
        retention-days: 14

    # Upload test results in multiple formats
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          junit.xml
          test-results.json
          playwright-report/
        retention-days: 14

  # Download and use artifacts from build job
  deploy-staging:
    needs: [build-artifacts, test-and-report]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-${{ needs.build-artifacts.outputs.build-version }}
        path: dist/

    - name: Download build info
      uses: actions/download-artifact@v4
      with:
        name: build-info-${{ needs.build-artifacts.outputs.build-version }}
        path: build-info/

    - name: Verify artifact integrity
      run: |
        cd dist
        sha256sum -c ../build-info/checksums.txt

    - name: Deploy to staging
      env:
        VERSION: ${{ needs.build-artifacts.outputs.build-version }}
      run: |
        echo "Deploying version $VERSION to staging"
        ls -la dist/
        cat build-info/version.txt
        # Add actual deployment commands

  # Download all artifacts for release packaging
  create-release:
    needs: [build-artifacts, test-and-report]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts/

    - name: Create release package
      run: |
        cd release-artifacts
        
        # List all downloaded artifacts
        find . -type f -name "*.txt" -exec cat {} \;
        
        # Create comprehensive release package
        mkdir -p ../release-package
        
        # Copy build artifacts
        cp -r build-*/dist/* ../release-package/ 2>/dev/null || echo "No build dist"
        
        # Copy documentation
        cp -r documentation-*/* ../release-package/docs/ 2>/dev/null || echo "No docs"
        
        # Create release manifest
        echo "Release: ${{ github.ref_name }}" > ../release-package/RELEASE.txt
        echo "Built from: ${{ github.sha }}" >> ../release-package/RELEASE.txt
        echo "Build date: $(date)" >> ../release-package/RELEASE.txt

    - name: Create release archive
      run: |
        tar -czf release-${{ github.ref_name }}.tar.gz -C release-package .
        zip -r release-${{ github.ref_name }}.zip release-package/

    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: release-package-${{ github.ref_name }}
        path: |
          release-*.tar.gz
          release-*.zip
        retention-days: 365

  # Artifact cleanup and management
  artifact-management:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    permissions:
      actions: write
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          
          // Get all artifacts
          const artifacts = await github.rest.actions.listArtifactsForRepo({
            owner,
            repo,
            per_page: 100
          });
          
          // Delete artifacts older than 30 days
          const thirtyDaysAgo = new Date();
          thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
          
          for (const artifact of artifacts.data.artifacts) {
            const createdAt = new Date(artifact.created_at);
            
            if (createdAt < thirtyDaysAgo && !artifact.name.includes('release-package')) {
              console.log(`Deleting old artifact: ${artifact.name}`);
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id
              });
            }
          }

  # Cross-job artifact sharing
  artifact-analysis:
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-${{ needs.build-artifacts.outputs.build-version }}
        path: dist/

    - name: Analyze bundle size
      run: |
        du -sh dist/*
        find dist -name "*.js" -exec wc -c {} + | sort -n

    - name: Check for large files
      run: |
        find dist -size +1M -type f -exec ls -lh {} \; > large-files.txt
        if [ -s large-files.txt ]; then
          echo "Large files found:"
          cat large-files.txt
        fi

    - name: Upload analysis results
      uses: actions/upload-artifact@v4
      with:
        name: bundle-analysis
        path: large-files.txt
        retention-days: 7