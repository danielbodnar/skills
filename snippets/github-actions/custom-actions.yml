# Examples of Custom Actions Usage
# Demonstrates creating and using custom GitHub Actions

name: Custom Actions

on:
  push:
    branches: [ main ]

jobs:
  # Using JavaScript/TypeScript custom action
  use-js-action:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Use local JavaScript action
      uses: ./.github/actions/custom-js-action
      with:
        input1: 'value1'
        input2: 'value2'
      env:
        CUSTOM_TOKEN: ${{ secrets.CUSTOM_TOKEN }}

    - name: Use external JavaScript action
      uses: organization/custom-action@v1
      with:
        api_endpoint: 'https://api.example.com'
        timeout: '30'

  # Using Docker custom action
  use-docker-action:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Use Docker action
      uses: ./.github/actions/docker-action
      with:
        dockerfile_path: './Dockerfile'
        build_args: |
          NODE_VERSION=20
          ENV=production

  # Using composite action (shell scripts)
  use-composite-action:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Use composite action
      uses: ./.github/actions/setup-environment
      with:
        node_version: '20'
        install_dependencies: true
        cache_key_suffix: 'custom'