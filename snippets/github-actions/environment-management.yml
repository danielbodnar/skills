# Environment Management and Multi-Environment Deployments
# Demonstrates environment protection rules, secrets, and deployment strategies

name: Environment Management

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      force_deploy:
        description: 'Force deployment (skip some checks)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build stage (common for all environments)
  build:
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=$GITHUB_SHA
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Development environment (auto-deploy on develop branch)
  deploy-development:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'development')

    environment:
      name: development
      url: https://dev.example.com

    steps:
    - name: Deploy to development
      env:
        IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        DEV_API_KEY: ${{ secrets.DEV_API_KEY }}
        DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      run: |
        echo "Deploying $IMAGE_TAG to development"
        echo "Using development configuration"
        # Add actual deployment commands

    - name: Run smoke tests
      run: |
        echo "Running smoke tests against development"
        curl -f https://dev.example.com/health

  # Staging environment (requires manual approval for main branch)
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == 'staging')

    environment:
      name: staging
      url: https://staging.example.com

    steps:
    - name: Deploy to staging
      env:
        IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
        STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      run: |
        echo "Deploying $IMAGE_TAG to staging"
        echo "Using staging configuration"
        # Add actual deployment commands

    - name: Run integration tests
      run: |
        echo "Running integration tests against staging"
        # Add integration test commands

    - name: Notify team
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const sha = context.sha;

          await github.rest.repos.createCommitStatus({
            owner,
            repo,
            sha,
            state: 'success',
            target_url: 'https://staging.example.com',
            description: 'Deployed to staging',
            context: 'deployment/staging'
          });

  # Production environment (requires tag and manual approval)
  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == 'production' &&
       github.event.inputs.force_deploy == true)

    environment:
      name: production
      url: https://example.com

    steps:
    - name: Pre-deployment checks
      if: github.event.inputs.force_deploy != 'true'
      run: |
        echo "Running pre-deployment checks"
        # Add pre-deployment validation

    - name: Deploy to production
      env:
        IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
        PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      run: |
        echo "Deploying $IMAGE_TAG to production"
        echo "Using production configuration"
        # Add actual deployment commands

    - name: Run health checks
      run: |
        echo "Running health checks against production"
        curl -f https://example.com/health
        curl -f https://example.com/api/status

    - name: Create GitHub release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const tagName = context.ref.replace('refs/tags/', '');

          await github.rest.repos.createRelease({
            owner,
            repo,
            tag_name: tagName,
            name: `Release ${tagName}`,
            body: `Deployed version ${tagName} to production`,
            draft: false,
            prerelease: false
          });

  # Rollback capability
  rollback:
    runs-on: ubuntu-latest
    if: failure() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [deploy-staging, deploy-production]

    environment:
      name: production
      url: https://example.com

    steps:
    - name: Rollback production
      env:
        PREVIOUS_VERSION: ${{ vars.PREVIOUS_PROD_VERSION }}
      run: |
        echo "Rolling back to previous version: $PREVIOUS_VERSION"
        # Add rollback commands

    - name: Verify rollback
      run: |
        echo "Verifying rollback successful"
        curl -f https://example.com/health

  # Environment cleanup (for feature branches)
  cleanup-environment:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    steps:
    - name: Cleanup preview environment
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        echo "Cleaning up preview environment for PR #$PR_NUMBER"
        # Add cleanup commands for preview environments