# Comprehensive Event Triggers and Conditions
# Demonstrates various trigger patterns and conditional execution

name: Event Triggers

# Multiple trigger events
on:
  # Push events
  push:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/**'

  # Pull request events
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'

  # Issue events
  issues:
    types: [opened, labeled]

  # Release events
  release:
    types: [published, prereleased]

  # Schedule (cron)
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM UTC
    - cron: '0 0 * * *'  # Daily at midnight UTC

  # Manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version to deploy'
        required: true
        type: string
      skip_tests:
        description: 'Skip tests'
        required: false
        type: boolean
        default: false

  # Workflow call (reusable)
  workflow_call:
    inputs:
      config_path:
        required: true
        type: string
    secrets:
      api_key:
        required: true

jobs:
  # Conditional job based on trigger
  conditional-execution:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run on push to main
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "Push to main detected"

    - name: Run on PR
      if: github.event_name == 'pull_request'
      run: echo "Pull request detected"

    - name: Run on tag
      if: startsWith(github.ref, 'refs/tags/')
      run: echo "Tag push detected: ${{ github.ref_name }}"

    - name: Run on manual trigger
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "Manual trigger detected"
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "Version: ${{ github.event.inputs.version }}"
        echo "Skip tests: ${{ github.event.inputs.skip_tests }}"

  # Draft PR handling
  draft-pr-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run tests for ready PR
      run: echo "Running tests for ready PR"

  # Issue labeling automation
  issue-triage:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    
    permissions:
      issues: write

    steps:
    - name: Add triage label
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            labels: ['triage']
          });

  # Scheduled maintenance
  scheduled-tasks:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Weekly dependency audit
      if: github.event.schedule == '0 2 * * 1'
      run: |
        echo "Running weekly dependency audit"
        npm audit

    - name: Daily health check
      if: github.event.schedule == '0 0 * * *'
      run: |
        echo "Running daily health check"
        curl -f https://api.example.com/health

  # Path-based conditional execution
  path-filtering:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Check changed files
      id: changes
      run: |
        # Check if docs changed
        if git diff --name-only HEAD^ HEAD | grep -q '^docs/'; then
          echo "docs_changed=true" >> $GITHUB_OUTPUT
        fi
        
        # Check if source code changed
        if git diff --name-only HEAD^ HEAD | grep -q '^src/'; then
          echo "src_changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Build docs
      if: steps.changes.outputs.docs_changed == 'true'
      run: echo "Building documentation"

    - name: Run tests
      if: steps.changes.outputs.src_changed == 'true'
      run: echo "Running tests"