# Security Best Practices
# Demonstrates secure workflow patterns with OIDC, permissions, and secrets

name: Security Patterns

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Default permissions - principle of least privilege
permissions:
  contents: read

jobs:
  # Security scanning and SAST
  security-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      if: github.event_name == 'pull_request'

  # OIDC with AWS deployment
  aws-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials with OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        role-session-name: GitHubActions-${{ github.run_id }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Deploy to S3
      run: |
        aws s3 sync ./dist s3://${{ vars.S3_BUCKET }} --delete

  # Secure artifact handling
  secure-artifacts:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build artifacts
      run: |
        mkdir -p dist
        echo "Built at $(date)" > dist/build-info.txt

    - name: Generate build attestation
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: 'dist/*'

    - name: Upload artifacts with attestation
      uses: actions/upload-artifact@v4
      with:
        name: secure-build
        path: dist/
        retention-days: 30

  # Environment-specific deployment with protection rules
  protected-deploy:
    needs: [security-scan]
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      deployments: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Use environment secrets safely
      env:
        API_KEY: ${{ secrets.PROD_API_KEY }}
        DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      run: |
        # Never echo secrets
        echo "Deploying with configured credentials"
        # Use secrets securely in deployment commands

    - name: Deploy to production
      run: |
        echo "Deploying to production environment"
        # Add deployment commands here

  # Workflow security hardening
  hardened-workflow:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit
        allowed-endpoints: |
          api.github.com:443
          github.com:443
          objects.githubusercontent.com:443

    - name: Checkout with token
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: false

    - name: Validate checksums
      run: |
        # Verify file integrity
        sha256sum package.json
        sha256sum package-lock.json