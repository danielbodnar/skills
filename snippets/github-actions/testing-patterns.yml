# Testing Patterns and Quality Assurance
# Comprehensive testing strategies for different languages and frameworks

name: Testing Patterns

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # JavaScript/TypeScript testing with multiple frameworks
  javascript-testing:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        test-framework: [jest, vitest, playwright]
        node-version: [18, 20]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests (Jest)
      if: matrix.test-framework == 'jest'
      run: |
        npm run test:unit
        npm run test:coverage

    - name: Run unit tests (Vitest)
      if: matrix.test-framework == 'vitest'
      run: |
        npm run test:vitest
        npm run coverage

    - name: Install Playwright dependencies
      if: matrix.test-framework == 'playwright'
      run: npx playwright install --with-deps

    - name: Run E2E tests (Playwright)
      if: matrix.test-framework == 'playwright'
      run: npm run test:e2e

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.test-framework }}-node${{ matrix.node-version }}
        path: |
          coverage/
          test-results/
          playwright-report/

  # Bun testing
  bun-testing:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1

    - name: Install dependencies
      run: bun install

    - name: Run tests with Bun
      run: |
        bun test
        bun run test:coverage

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/lcov.info

  # Rust testing
  rust-testing:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust-version: [stable, beta]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust-version }}
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy -- -D warnings

    - name: Run tests
      run: cargo test --verbose

    - name: Run doctests
      run: cargo test --doc

    - name: Generate coverage
      if: matrix.os == 'ubuntu-latest' && matrix.rust-version == 'stable'
      run: |
        cargo install cargo-tarpaulin
        cargo tarpaulin --out xml

  # Python testing
  python-testing:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov black flake8 mypy
        pip install -r requirements.txt

    - name: Check code formatting
      run: black --check .

    - name: Run linting
      run: flake8 .

    - name: Run type checking
      run: mypy .

    - name: Run tests
      run: |
        pytest --cov=src --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml

  # Go testing
  go-testing:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        go-version: ['1.20', '1.21']

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Run tests
      run: |
        go test -v -race -coverprofile=coverage.out ./...
        go tool cover -html=coverage.out -o coverage.html

    - name: Run benchmarks
      run: go test -bench=. -benchmem ./...

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: go-coverage-${{ matrix.go-version }}
        path: coverage.html

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint:js

    - name: Run Prettier check
      run: npm run format:check

    - name: Run TypeScript check
      run: npm run type-check

    - name: Run dependency audit
      run: npm audit --audit-level=high

    - name: Check bundle size
      run: npm run build:analyze

    - name: SonarQube Scan
      uses: sonarqube-quality-gate-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Performance testing
  performance-testing:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Start application
      run: |
        npm start &
        sleep 10

    - name: Run Lighthouse CI
      run: |
        npm install -g @lhci/cli
        lhci autorun

    - name: Run load tests
      run: |
        npm install -g artillery
        artillery run tests/load-test.yml

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: |
          .lighthouseci/
          artillery-report.json