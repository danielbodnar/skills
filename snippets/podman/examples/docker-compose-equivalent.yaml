# Docker Compose equivalent using Podman Kube Play
# Usage: podman play kube wordpress.yaml

apiVersion: v1
kind: Pod
metadata:
  name: wordpress-app
  labels:
    app: wordpress
spec:
  containers:
  - name: wordpress
    image: wordpress:latest
    ports:
    - containerPort: 80
    env:
    - name: WORDPRESS_DB_HOST
      value: "127.0.0.1:3306"
    - name: WORDPRESS_DB_USER
      value: "wordpress"
    - name: WORDPRESS_DB_PASSWORD
      value: "wordpress_password"
    - name: WORDPRESS_DB_NAME
      value: "wordpress"
    volumeMounts:
    - name: wordpress-data
      mountPath: /var/www/html
      
  - name: mysql
    image: mysql:8.0
    env:
    - name: MYSQL_ROOT_PASSWORD
      value: "root_password"
    - name: MYSQL_DATABASE
      value: "wordpress"
    - name: MYSQL_USER
      value: "wordpress"
    - name: MYSQL_PASSWORD
      value: "wordpress_password"
    volumeMounts:
    - name: mysql-data
      mountPath: /var/lib/mysql
    ports:
    - containerPort: 3306

  volumes:
  - name: wordpress-data
    persistentVolumeClaim:
      claimName: wordpress-pvc
  - name: mysql-data
    persistentVolumeClaim:
      claimName: mysql-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi