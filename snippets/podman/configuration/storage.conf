# Podman storage.conf Configuration
# Location: ~/.config/containers/storage.conf

[storage]
# Storage driver
driver = "overlay"

# Storage root directory
graphroot = "/var/lib/containers/storage"

# Storage state directory  
runroot = "/run/containers/storage"

# Image store (read-only)
# imagestore = "/usr/lib/containers/storage"

[storage.options]
# Overlay storage options
mount_program = "/usr/bin/fuse-overlayfs"

# Additional image stores
additionalimagestores = [
  "/usr/lib/containers/storage"
]

[storage.options.overlay]
# Overlay specific options
mountopt = "nodev,metacopy=on"

# Force mask for new files
force_mask = "0000"

# Skip mount home
skip_mount_home = "false"

# Size limit for volumes
size = ""

[storage.options.vfs]
# VFS storage options
ignore_chown_errors = "false"

[storage.options.zfs]
# ZFS storage options
fsname = ""
mountopt = ""

[storage.options.btrfs]
# Btrfs storage options  
min_space = "10G"
size = ""

# Example rootless configuration
# [storage]
# driver = "overlay"
# graphroot = "$HOME/.local/share/containers/storage"
# runroot = "/run/user/$UID/containers"
# 
# [storage.options]
# mount_program = "/usr/bin/fuse-overlayfs"