# Podman containers.conf Configuration
# Location: ~/.config/containers/containers.conf

[containers]
# Default user inside container
default_user = ""

# Default command
init = true

# Default capabilities
default_capabilities = [
  "CHOWN",
  "DAC_OVERRIDE", 
  "FOWNER",
  "FSETID",
  "KILL",
  "NET_BIND_SERVICE",
  "SETFCAP",
  "SETGID",
  "SETPCAP",
  "SETUID",
  "SYS_CHROOT"
]

# DNS configuration
dns_servers = [
  "8.8.8.8",
  "8.8.4.4"
]

# Network backend
netns = "slirp4netns"

# Environment variables
env = [
  "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
  "TERM=xterm"
]

# Timezone
tz = ""

# Default ulimits
default_ulimits = [
  "nofile=65536:65536"
]

[secrets]
driver = "file"

[network]
# Network backend
network_backend = "netavark"

# Default subnet
default_subnet = "10.88.0.0/16"

# Default subnet pools
default_subnet_pools = [
  {"base" = "10.89.0.0/16", "size" = 24},
  {"base" = "10.90.0.0/16", "size" = 24}
]

[engine]
# Cgroup manager
cgroup_manager = "systemd"

# Event logger
events_logger = "journald"

# Image default transport
image_default_transport = "docker://"

# OCI runtime
runtime = "crun"

# Service timeout
service_timeout = 5

# Stop timeout
stop_timeout = 10

# Helper binaries directory
helper_binaries_dir = [
  "/usr/libexec/podman",
  "/usr/local/libexec/podman",
  "/usr/local/lib/podman",
  "/usr/bin",
  "/usr/local/bin"
]