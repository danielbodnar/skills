<!-- Basic TailwindCSS usage examples -->

<!-- Card component with utility classes -->
<div class="mx-auto flex max-w-sm items-center gap-x-4 rounded-xl bg-white p-6 shadow-lg outline outline-black/5 dark:bg-slate-800 dark:shadow-none dark:-outline-offset-1 dark:outline-white/10">
  <img class="size-12 shrink-0" src="/img/logo.svg" alt="ChitChat Logo" />
  <div>
    <div class="text-xl font-medium text-black dark:text-white">ChitChat</div>
    <p class="text-gray-500 dark:text-gray-400">You have a new message!</p>
  </div>
</div>

<!-- Simple button with hover states -->
<button class="rounded-full border border-purple-200 px-4 py-1 text-sm font-semibold text-purple-600 hover:border-transparent hover:bg-purple-600 hover:text-white active:bg-purple-700">
  Message
</button>

<!-- Flexbox layout with responsive design -->
<div class="flex flex-col gap-2 p-8 sm:flex-row sm:items-center sm:gap-6 sm:py-4">
  <img class="mx-auto block h-24 rounded-full sm:mx-0 sm:shrink-0" src="/img/avatar.jpg" alt="Profile" />
  <div class="space-y-2 text-center sm:text-left">
    <div class="space-y-0.5">
      <p class="text-lg font-semibold text-black">John Doe</p>
      <p class="font-medium text-gray-500">Product Manager</p>
    </div>
  </div>
</div>

<!-- Grid layout -->
<div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
  <div class="rounded-lg bg-blue-500 p-4 text-white">01</div>
  <div class="rounded-lg bg-blue-500 p-4 text-white">02</div>
  <div class="rounded-lg bg-blue-500 p-4 text-white">03</div>
</div>

<!-- Form input -->
<input type="text" class="block w-full rounded-md border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder="Enter your email" />
